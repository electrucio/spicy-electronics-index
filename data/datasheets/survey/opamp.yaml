# The op-amp data sheets the survey reads (`sei datasheets survey --kind opamp`): what each maker measures
# and prints, as the evidence docs/opamp-characterisation.md draws its bench from. Chosen from the top of the
# index's usage list (data/models/wanted.yaml, `opamp`) and widened across makers, because the test set
# varies more by maker than by device: TI's two formats (the post-2015 one with 40–90 figures, the legacy one
# with a "Table of Graphs"), onsemi's Motorola designs, Analog Devices' precision and audio sheets, ST,
# Rohm, NXP (the Philips/Signetics sheets), Renesas (the RCA/Intersil CMOS parts).
#
# how: direct          the maker's robots.txt lets a script read the sheet, at its pace
#      wayback         the maker's site refuses scripts (ST, Analog Devices, Rohm — data/datasheets/sources.yaml
#                      says how each was found out): the Internet Archive's capture of the maker's own address
#                      is read, the maker's address is what is published, with the copy beside it
#      wayback-prefix  the same, for an address the maker does not keep stable: the newest capture under
#                      `prefix` whose name matches `pick`
#      none            robots.txt disallows the PDF to scripts (Nisshinbo: /*.pdf$ for every agent;
#                      Microchip: everything): the address is published, the sheet is not read, and what
#                      it prints is known only from a copy a person opened (`read_by_hand`)
kind: opamp
sheets:
