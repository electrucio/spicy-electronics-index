- id: opamp-emirr
  kind: opamp
  group: dc
  name: Rejection of an RF carrier at the input
  symbols: [EMIRR]
  what: |
    A 100 mV peak carrier at 10 MHz, 100 MHz, 400 MHz and 1 GHz on the non-inverting input of a follower,
    the DC shift of the output read after it settles, EMIRR = 20 log (VRF / ΔVOS) (TI's new sheets print
    it). Nearly every macromodel has no input filter and rectifies nothing: the shift is zero and the
    result absent, which is what a reader needs to know before trusting a model near a transmitter.
  circuit: The follower with 2 kΩ, the carrier on its input; two hundred cycles, the mean of the last hundred.
  drawing: {file: "", elements: [DUT as a follower, RF source on the input], differs_from_netlist: one deck per carrier}
  analysis: tran
  conditions:
    supply: [15, -15]
    rl: 2000
    amplitude: 0.1
    carriers: [1.0e+7, 1.0e+8, 4.0e+8, 1.0e+9]
    cycles: 200
    steps_per_cycle: 20
  extraction: The mean output over the last hundred cycles less the offset; a shift below 50 µV is the simulator's noise, and the rejection absent.
  outputs:
  - {key: "emirr@{f}", unit: dB, what: "the carrier over the offset shift it causes, or absent"}
  - {key: "vos_shift@{f}", unit: V, what: "the shift itself"}
  parameters: []
  reads_high: ""
  reads_low: ""
  cannot_tell: "The real part's rectification, which lives in the input stage's junctions and the package."
  standard: none
  pack: false
  engines: [qspice, ngspice]
  directives:
  - "VP vp 0 15"
  - "VN vn 0 -15"
  - "* the carrier: 100 mV peak at 10 MHz; then 100 MHz, 400 MHz and 1 GHz"
  - "VIN in 0 SIN(0 0.1 10000000)"
  - "XE in out vp vn out DUT"
  - "RL out 0 2000"

- id: opamp-aol
  kind: opamp
  group: frequency
  name: Open-loop gain and phase, GBW and the margins
  symbols: [AOL, GBW, PM]
  what: |
    The open loop by the inductor/capacitor trick: a 1 GH inductor in the feedback and a 1 GF capacitor
    to ground hold the DC operating point and open the loop above a microhertz. The output over the input
    is the open-loop gain, 1 Hz to 100 MHz at 20 points per decade, with 2 kΩ and 100 pF on the output.
    Read: AOL at DC, the gain-bandwidth product at 10 kHz and 100 kHz (Nisshinbo's two numbers), the
    unity-gain frequency, the phase and gain margins, the dominant pole and the second pole (reported
    absent when the model is single-pole, since no amplifier is). Variants at 600 Ω and 10 kΩ, at ±5 and
    ±9 V, at −55 and 125 °C.
  circuit: |
    The amplifier with the AC source on its non-inverting input, the inverting input tied to the output
    through 1 GH and to ground through 1 GF, 2 kΩ and 100 pF on the output.
  drawing: {file: "", elements: [DUT, 1 GH feedback inductor, 1 GF capacitor to ground, AC source, 2 kΩ and 100 pF load], differs_from_netlist: one deck per variant}
  analysis: ac
  conditions:
    supply: [15, -15]
    rl: 2000
    cl: 1.0e-10
    sweep: {from: 1, to: 1.0e+8, per_decade: 20, unit: Hz}
    rl_variants: [600, 10000]
    supply_variants: [[5, -5], [9, -9]]
    temps_c: [-55, 125]
  grid: {x: f, from: 1, to: 1.0e+8, per_decade: 5, unit: Hz}
  extraction: |
    |AOL| and its phase (unwrapped, the DC phase as zero); GBW as |AOL| × f at 10 kHz and 100 kHz; the
    unity-gain frequency where |AOL| passes 1; the phase margin as 180° plus the phase there; the gain
    margin as −|AOL| in dB where the phase passes −180°; f_p1 where the gain has fallen 3 dB; f_p2 where
    the phase passes −135°. The ratios of the DC gain and the GBW at 125 °C over 25 °C.
  outputs:
  - {key: aol_dc, unit: dB, what: "open-loop gain at DC, 2 kΩ, ±15 V"}
  - {key: "gbw@10kHz", unit: Hz, what: "gain × frequency at 10 kHz"}
  - {key: "gbw@100kHz", unit: Hz, what: "gain × frequency at 100 kHz"}
  - {key: f_unity, unit: Hz, what: "where the open-loop gain passes 1"}
  - {key: pm, unit: "°", what: "phase margin at 2 kΩ and 100 pF"}
  - {key: gain_margin, unit: dB, what: "gain margin, where the phase passes −180°"}
  - {key: f_p1, unit: Hz, what: "the dominant pole"}
  - {key: f_p2, unit: Hz, what: "the second pole, where the phase passes −135°"}
  - {key: f_p2_note, unit: "", what: "absent when the model is single-pole"}
  - {key: "aol_dc@{tag}", unit: dB, what: "the DC gain at the other loads, supplies and temperatures"}
  - {key: "gbw@100kHz,{tag}", unit: Hz, what: "the GBW at the other loads, supplies and temperatures"}
  - {key: "pm@{tag}", unit: "°", what: "the phase margin at the other loads, supplies and temperatures"}
  - {key: "aol_ratio@125°C/25°C", unit: "", what: "DC gain at 125 °C over 25 °C"}
  - {key: "gbw_ratio@125°C/25°C", unit: "", what: "GBW at 125 °C over 25 °C"}
  curves:
  - {name: "gain", x: f, y: gain, scale: log, unit: ""}
  - {name: "phase", x: f, y: phase, scale: lin, unit: "°"}
  - {name: "gain, 600Ω", x: f, y: gain, scale: log, unit: "", at: {RL: 600}}
  - {name: "gain, 10kΩ", x: f, y: gain, scale: log, unit: "", at: {RL: 10000}}
  - {name: "gain, ±5V", x: f, y: gain, scale: log, unit: "", at: {VS: 10}}
  - {name: "gain, ±9V", x: f, y: gain, scale: log, unit: "", at: {VS: 18}}
  - {name: "gain, -55°C", x: f, y: gain, scale: log, unit: "", at: {T: -55}}
  - {name: "gain, 125°C", x: f, y: gain, scale: log, unit: "", at: {T: 125}}
  parameters: []
  reads_high: "A GBW that does not move with temperature or supply is a macromodel with fixed poles."
  reads_low: "A second pole absent is a single-pole model: its phase margin is 90° whatever the load, and a stability figure means nothing."
  cannot_tell: "The gain with an external compensation pin; a part with one is run as its model's own default."
  standard: none
  pack: false
  engines: [qspice, ngspice, ltspice]
  directives:
  - "VP vp 0 15"
  - "VN vn 0 -15"
  - "* the AC source on the non-inverting input"
  - "VIN inp 0 DC 0 AC 1"
  - "* the loop: closed at DC through 1 GH, open above a microhertz; 1 GF holds the inverting input"
  - "L1 out inn 1G"
  - "C1 inn 0 1G"
  - "XA inp inn vp vn out DUT"
  - "RL out 0 2000"
  - "CL out 0 1e-10"
  - "* 1 Hz to 100 MHz, twenty points per decade"
  - ".ac dec 20 1 100000000"

