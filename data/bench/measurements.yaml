    1 Hz to 10 MHz, at VCM = 0 and 2 V from each rail (onsemi's curves). Read at 10 Hz, 1 kHz, 10 kHz,
    100 kHz and 1 MHz, and the corner where it starts to fall. A model with no common-mode path reports
    a rejection beyond 200 dB: absent.
  circuit: |
    Three copies of the difference amplifier in one deck, each with four 10 kΩ resistors and a 2 kΩ load,
    the common-mode source at 0, −13 and +13 V DC with 1 V of AC.
