    vcm: [0, -13, 13]
    r: 10000
    rl: 2000
    sweep: {from: 1, to: 1.0e+7, per_decade: 20, unit: Hz}
    f_points: [10, 1000, 10000, 100000, 1000000]
  grid: {x: f, from: 1, to: 1.0e+7, per_decade: 5, unit: Hz}
  extraction: |
    CMRR = −20 log |VOUT| for 1 V of common mode; the corner is where it has fallen 3 dB below its 1 Hz
