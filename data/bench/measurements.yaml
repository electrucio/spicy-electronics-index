  - {name: "CMRR, VCM=-13V", x: f, y: cmrr, scale: lin, unit: dB, at: {VCM: -13}}
  - {name: "CMRR, VCM=13V", x: f, y: cmrr, scale: lin, unit: dB, at: {VCM: 13}}
  select: {VCM: 0}
  parameters: []
  reads_high: "Above 200 dB: no common-mode path in the model."
  reads_low: ""
  cannot_tell: "The resistors' mismatch, which limits the real measurement; these are exact."
