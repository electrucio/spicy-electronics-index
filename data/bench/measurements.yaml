- id: opamp-thd-f
  kind: opamp
  group: distortion
  name: THD against frequency (model against model)
  symbols: [THD(f)]
  what: |
    A sine at 20 Hz, 100 Hz, 1 kHz, 10 kHz and 20 kHz at 1 Vrms and 3 Vrms through the follower and at
    3 Vrms at G = +10 (1 kΩ and 9 kΩ), into 2 kΩ, harmonics 2 to 10 by Goertzel over the last eight of
    twelve cycles. Published for comparison between models: a macromodel's distortion is its slew, its
    clipping and whatever its output stage does, not the die's.
  circuit: The follower (or the non-inverting amplifier) with 2 kΩ, the sine on its input; one deck per point.
  drawing: {file: "", elements: [DUT, sine source, 2 kΩ load], differs_from_netlist: "one deck per frequency, level and gain"}
  analysis: tran
  conditions:
    supply: [15, -15]
    rl: 2000
    r1: 1000
    r_inv: 10000
    f: [20, 100, 1000, 10000, 20000]
    vrms: [1, 3]
    gain2: 10
    cycles: 12
    analysed_cycles: 8
    steps_per_cycle: 4096
  extraction: THD as the root of the sum of the squares of harmonics 2 to 10 over the fundamental; the second and third harmonics at 1 kHz, 3 Vrms, G = 1.
  outputs:
  - {key: "thd@{f},{level},{gain}", unit: "", what: "THD at each frequency, level and gain"}
  - {key: "hd2@1kHz,3Vrms,G=1", unit: "", what: "second harmonic over the fundamental"}
  - {key: "hd3@1kHz,3Vrms,G=1", unit: "", what: "third harmonic over the fundamental"}
  curves:
  - {name: "THD vs f, 1Vrms, G=1", x: f, y: thd, scale: log, unit: "", at: {G: 1}, grid: {x: f, values: [20, 100, 1000, 10000, 20000], unit: Hz}}
  - {name: "THD vs f, 3Vrms, G=1", x: f, y: thd, scale: log, unit: "", at: {G: 1}, grid: {x: f, values: [20, 100, 1000, 10000, 20000], unit: Hz}}
  - {name: "THD vs f, 3Vrms, G=10", x: f, y: thd, scale: log, unit: "", at: {G: 10}, grid: {x: f, values: [20, 100, 1000, 10000, 20000], unit: Hz}}
  parameters: []
  reads_high: "Only against another model of the same part."
  reads_low: "Parts per million at every frequency is a model with no non-linearity but its clamps."
  cannot_tell: "The distortion of the part; the sheets' figures come from the die."
  standard: none
  pack: false
  engines: [qspice, ngspice, ltspice]
  directives:
  - "VP vp 0 15"
  - "VN vn 0 -15"
  - "* 1 Vrms (1.414 V peak) at 20 Hz into the follower; the ladder follows"
  - "VIN in 0 SIN(0 1.41421356 20)"
  - "XD in out vp vn out DUT"
  - "RL out 0 2000"

