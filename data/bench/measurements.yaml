# The measurement catalogue: what the bench measures of every transistor model, how, and what each
# number tells. One entry per measurement. The text is shown once, on the site's method page
# (?bench=), and every number a part page shows links to its entry here; the decks inside the simulator
# images read their conditions from the same entry, so the method described is the method run.
#
# Conventions. Conditions are universal ladders, the same for every model of a kind (decades of
# current, a short list of voltages, three temperatures): nothing here depends on the part's data sheet
# or on its class. Output keys with placeholders are instantiated per ladder step, the placeholder
# written as an SI value with its prefix and no space ("hfe@1mA,5V", "cob@10V"). Values are published
# in SI units with 4 significant figures. A step the model cannot reach is reported with a code
# (below), never as a number. The behaviour `group` ids are those of
# src/spicy_electronics_index/models/behaviours.py. `standard` names the family of test methods a measurement
# resembles; the method number is checked against the standard's own table of contents before it is
# printed, and the word is "resembles" because the fixtures here are simplified.
#
# Circuits are described in prose and in the `drawing` block; no model card is ever quoted here.
# `directives` quotes, verbatim, the lines of the single-model QSPICE deck that set the circuit up and the
# analysis (a test checks them against the generated deck); a line starting with * says what the next line
# does, and a trailing one what is read. The drawing illustrates the set-up a person would wire for the
# measurement, semantically faithful; it need not mirror the netlist, which the directives show exactly. `version`
# names the conditions: it moves when a condition, grid, output key or curve changes, and the bench
# fingerprint covers only those, so the text can be improved without rerunning anything.

version: m-13

# The dropdowns of a chart. A curve says the values of the parameters it was taken at (`at: {VCE: 5}`),
# the chart offers one selector per parameter present among the curves of a quantity, and a measurement
# may set the value shown first (`select: {VCE: 5}`, or `all` to overlay every value). A curve whose x is
# not the measurement's own carries its own `grid`.
selectors:
  VCE: {unit: V, what: collector-emitter voltage}
  T: {unit: "°C", what: temperature}
  IC: {unit: A, what: collector current}
  f: {unit: Hz, what: frequency}
  RS: {unit: "Ω", what: source resistance}
  IC/IB: {unit: "", what: the forced current gain, collector current over base current}
  IB step: {unit: A, what: "the base current per trace of the curve tracer: a universal value, or auto, a fifth of the IB that gives 10 mA at 5 V in that model"}
  span: {unit: "", what: the temperature span of a slope}
  VCC: {unit: V, what: the supply of a switching fixture}
  pulse: {unit: s, what: "the length of a switching fixture's drive pulse"}
  band: {unit: "", what: "the band a noise figure is taken over: a spot at 1 kHz, or 10 Hz to 15.7 kHz"}
  VDS: {unit: V, what: drain-source voltage}
  VGS: {unit: V, what: gate-source voltage}
  ID: {unit: A, what: drain current}
  VGS step: {unit: V, what: "the gate voltage per trace of the curve tracer: a universal value, or auto, a fifth of the model's own VGS(off)"}
  VGS/VGS(off): {unit: "", what: "the gate voltage as a fraction of the model's own pinch-off voltage"}
  RL: {unit: "Ω", what: load resistance}
  Voff: {unit: V, what: "the gate voltage that holds the switch off: −10 V, or auto, twice the model's own VGS(off)"}
  VDD: {unit: V, what: "the supply of a MOSFET fixture"}
  RG: {unit: "Ω", what: "the gate drive resistance of a switching fixture"}
  VON: {unit: V, what: "the gate drive voltage of a switching fixture"}
  IF: {unit: A, what: "the forward current a diode carries before it is reversed"}
  VCM: {unit: V, what: "the common-mode voltage at an op-amp's inputs"}
  VS: {unit: V, what: "the total supply of an op-amp (±5 V is 10 V)"}
  G: {unit: "", what: "the closed-loop gain of an op-amp stage"}
  CL: {unit: F, what: "the capacitive load on an op-amp's output"}

codes:
  ok: measured
  absent: the card has no parameter for this physics, so the number would be the simulator's default, not the model's
  n/a: the model never reached this step (not saturated, not conducting, not switched) or the step is above the card's own breakdown
  failed: the simulator did not return a waveform for this deck; the error class is recorded
  suspect: a value no transistor has (the behavioural base drive settling on a wrong point in one engine); kept out of the numbers

# Which groups of measurements matter for which use. The only place "purpose" is spelt out: the part
# page shows groups and numbers, and the reader chooses.
uses:
- use: Small-signal audio stage or preamplifier
  groups: [dc, noise, capacitance, distortion]
  look_at: hFE and VBE between 100 µA and 1 mA, how flat hFE is over that range, en at 10 Hz to 1 kHz and the 1/f corner, Cob. The switching times do not matter.
- use: Power output stage
  groups: [high-current, temperature, dc, switching]
  look_at: hFE at 1 A and above and where it starts to fall, VCE(sat) and its slope with current, VBE and hFE against temperature, fT at high current. A model whose gain never falls will flatter an output stage.
- use: Switch or driver
  groups: [switching, high-current, breakdown, dc]
  look_at: td, tr, ts and tf at the switched current and the stored charge behind ts, VCE(sat) at that current, and whether breakdown is modelled at all (in most cards it is not).
- use: RF and video
  groups: [frequency, capacitance, noise]
  look_at: fT against IC and where it peaks, Cob and Cib against voltage, NF. The 1 kHz h-parameters do not matter.
- use: Current sources, mirrors and differential pairs
  groups: [dc, temperature]
  look_at: the Early voltage (output resistance), VBE and its slope with temperature, hFE at the operating current, and the reverse gain.
- use: Audio preamplifier, pedal or microphone input (JFET)
  groups: [dc, noise, capacitance, distortion, leakage]
  look_at: IDSS and VGS(off) (the bias point depends on both), gfs between 100 µA and IDSS, en at 10 Hz and 1 kHz and the 1/f corner, Ciss and Crss at the working VDS, the square-law exponent (second-harmonic character), the gate diode in forward bias (asymmetric clipping).
- use: Analogue switch or voltage-controlled resistor (JFET)
  groups: [dc, capacitance, switching]
  look_at: rDS(on) at VGS = 0 and how fast it rises towards VGS(off), the linearity of rDS with VDS, Crss (charge injection), ton and toff.
- use: Class-AB or follower output stage (MOSFET)
  groups: [temperature, dc, high-current, capacitance, distortion]
  look_at: the zero-temperature-coefficient point and dVth/dT (bias stability), gfs between 10 mA and 1 A, RDS(on) and its slope with temperature, Crss against VDS (the distortion mechanism at 20 kHz), the body diode's VSD.
- use: Switch, driver or converter (MOSFET)
  groups: [switching, capacitance, high-current, recovery, breakdown]
  look_at: RDS(on) at the drive voltage and current used, Qg, Qgd and the plateau voltage, td/tr/tf at that current and RG, Qgd/Qgs(th) (parasitic turn-on), the body diode's VSD and whether trr exists in the card, whether breakdown exists at all.
- use: Audio gain stage, preamplifier or filter (op-amp)
  groups: [noise, distortion, frequency, dc, output]
  look_at: whether the model has noise sources at all, then en at 1 kHz and 10 Hz; the open-loop gain and GBW, the phase margin into the capacitive load you use; the swing into 600 Ω and 2 kΩ; the slew rate; the offset and drift if DC-coupled. Distortion figures compare one model with another, never with the part.
- use: Headphone or line driver (op-amp)
  groups: [output, slew, distortion, supply]
  look_at: the swing and the short-circuit current into the load, VOUT against IOUT, THD against load, the full-power bandwidth, the supply current.
- use: Instrumentation, DC or servo (op-amp)
  groups: [dc, supply, frequency]
  look_at: the offset and its drift, the bias current and its drift, CMRR and PSRR at DC and against frequency, the input range, phase reversal, the settling time.

measurements:

# ------------------------------------------------------------------------------------------ bipolar
- id: bjt-tracer
  kind: bjt
  group: dc
  name: Output characteristics, as a curve tracer draws them
  symbols: [IC(VCE), IB]
  what: |
    The family of curves a data sheet opens with and a curve tracer draws on its screen: collector
    current against collector-emitter voltage, one trace per step of base current, the steps equal.
    Three things are read at a glance. The knee near the origin, where the transistor comes out of
    saturation: its position is VCE(sat), its sharpness the collector resistance. The slope of the flat
    part, which is the Early effect: a trace that keeps climbing means a low output resistance, and the
    traces extrapolate to meet the voltage axis at −VA. The spacing of the traces, which is the current
    gain: equal spacing means hFE is constant across the range, traces that bunch at the top mean it
    falls at high current. In a model the knee needs RC and BR, the slope needs VAF, the spacing IKF and
    the ISE/NE pair; a card without VAF draws the flat, parallel lines no transistor has.
  circuit: |
    Five copies of the transistor, each with a fixed base current of one to five times a step. The step
    is either one of sixteen universal values (a 1-2-5 series from 1 µA to 100 mA, which spans the
    steps small-signal and power data sheets use), so that models can be laid over one another, or
    "auto": a fifth of the base current that gave IC = 10 mA at VCE = 5 V in the hFE sweep, so that the
    top trace runs near 10 mA whatever the model's gain. Eighty-five copies in all share one sweep: the
    collector voltage of every copy is swept together from 0 to 10 V in 20 mV steps and each collector
    current is read through a 0 V source.
  drawing:
    file: bench/drawings/bjt-tracer.svg
    elements: [DUT, swept VCE source 0 to 10 V, base current source at k times the step, ammeter in the collector]
    differs_from_netlist: the eighty-five copies are drawn as one transistor with a stepped base current
  analysis: dc
  conditions:
    steps: 5
    top: {ic: 1.0e-2, vce: 5}       # auto: the top trace's base current is the one that gave this IC at this VCE
    ib_steps: [1.0e-6, 2.0e-6, 5.0e-6, 1.0e-5, 2.0e-5, 5.0e-5, 1.0e-4, 2.0e-4, 5.0e-4, 1.0e-3, 2.0e-3, 5.0e-3, 1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1]   # the universal steps, a 1-2-5 series, one family each
    vce_sweep: {from: 0, to: 10, step: 0.02, unit: V}
    temp_c: 25
  grid: {x: vce, values: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 7, 8, 9, 10], unit: V}
  extraction: |
    Each trace is the collector current of one copy, sampled on the grid, which is fine near the knee and
    coarser along the flat part. The auto step is kept so that a reader can put numbers on that family's
    spacing; the top auto trace's current at 10 V is kept as a figure. The universal families are
    published as they come: at a step too small for a power part they sit near zero, at one too large
    for a small-signal part they run into the rail, which is itself what the chart shows. Nothing else is
    read here: VA, VCE(sat) and hFE have their own measurements. A model whose hFE sweep never reached
    10 mA has no auto family.
  outputs:
  - {key: ib_step, unit: A, what: "the auto step: the base current per trace that puts the top trace near 10 mA at 5 V; trace k carries k times it"}
  - {key: "ic@10V,step5", unit: A, what: "collector current of the top auto trace at 10 V"}
  curves:
  - {name: "IC, step 1, auto", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: auto}, k: 1}
  - {name: "IC, step 2, auto", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: auto}, k: 2}
  - {name: "IC, step 3, auto", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: auto}, k: 3}
  - {name: "IC, step 4, auto", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: auto}, k: 4}
  - {name: "IC, step 5, auto", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: auto}, k: 5}
  - {name: "IC, step 1, IB step=1µA", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: 1.0e-6}, k: 1}
  - {name: "IC, step 2, IB step=1µA", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: 1.0e-6}, k: 2}
  - {name: "IC, step 3, IB step=1µA", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: 1.0e-6}, k: 3}
  - {name: "IC, step 4, IB step=1µA", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: 1.0e-6}, k: 4}
  - {name: "IC, step 5, IB step=1µA", x: vce, y: ic, scale: lin, unit: "A", at: {IB step: 1.0e-6}, k: 5}
