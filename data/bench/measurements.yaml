  select: {IC: 1.0e-3, f: 1000, band: "spot 1 kHz"}
  parameters: [RB, RBM, IRB, KF, AF, IS, NF, BF]
  reads_high: |
    A corner above 1 kHz is a noisy part or a KF set too high; a voltage noise above 2 nV/√Hz at 10 mA
    says a large rbb'.
  reads_low: |
    A flat spectrum down to 1 Hz is a card with KF = 0: it says nothing about the part's 1/f noise,
    and the code is "absent" for the corner. A voltage noise that keeps falling with current without
    limit is a card with RB = 0.
  cannot_tell: |
    Burst (popcorn) noise, which no SPICE model has; the current dependence of the corner in real
    parts; and what the part does, since noise is the behaviour makers measure least and model least.
  standard: resembles the spot noise figure method (MIL-STD-750-3) and the en/in curves of low-noise sheets
  pack: false
  engines: [qspice, ngspice]
  directives:
  - "* a 0 V source in the collector: the sensing element"
  - "VSENSE c cc 0"
  - "* the collector supply, 5 V"
  - "VC cc 0 5"
  - "* the transistor, emitter grounded; IB (not shown) feeds its base the DC current for the step, and VIN carries the matching VBE plus the noise input"
  - "Q1 c b 0 DUT"
  - "* the source resistance, run 1: 0 Ω (1 mΩ), which gives the voltage noise alone"
  - "RG in b 0.001"
  - "* run 2: 100 kΩ, which adds the current noise times 100 kΩ and the resistor's own thermal noise"
  - "RG in b 100000"
  - "* run 3, at 1 mA only: 1 kΩ, the data sheets' noise-figure condition"
  - "RG in b 1000"
  - "* the sensed current as a voltage: 1000 V per ampere"
  - "H1 out 0 VSENSE 1000"
  - "* a load for that voltage"
  - "RLOAD out 0 1meg"
  - "* the noise analysis: twenty points per decade from 1 Hz to 1 MHz, referred to VIN"
  - ".noise V(out) VIN dec 20 1 1000000"

- id: bjt-temperature
  kind: bjt
  group: temperature
  name: hFE, VBE and the saturation voltages at −55, 25, 100, 125 and 150 °C
  symbols: [dVBE/dT, hFE(T)]
  what: |
    The two temperature effects every designer meets. The base-emitter voltage falls by about
    2 mV for every kelvin of rise, which is the drift of every bias point, the reason output stages
    need thermal compensation, and the principle of the silicon thermometer. The current gain rises
    with temperature, typically by half again between 25 and 125 °C. A model carries the first through
    the temperature laws of IS (EG and XTI), which have defaults, so VBE always moves and only the
    slope is informative; it carries the second through XTB, which has a default of zero, so a card
    without XTB has a gain that does not move with temperature at all. Whether a simulation of an
    output stage runs away or settles depends on exactly these two numbers.
  circuit: |
    The hFE deck at VCE = 5 V, with the forced-ratio saturation circuit (IC/IB = 10) alongside, run with
    the simulator's temperature set to −55, 25, 100, 125 and 150 °C. hFE and VBE are read at 1 mA and at
    100 mA at each temperature; the saturation voltages are kept as curves.
  drawing:
    file: bench/drawings/bjt-temperature.svg
    elements: [DUT, VCE source 5 V, swept base current source, ammeter in the collector, voltmeter base to emitter, a thermometer symbol]
    differs_from_netlist: the temperature is a simulator setting; the saturation copy (IC = 10 IB) that rides in each deck is drawn in the saturation bench
  analysis: dc
  conditions:
    vce: 5
    ib_sweep: {from: 1.0e-9, to: 1, per_decade: 20, unit: A}
    temps_c: [-55, 25, 100, 125, 150]
    ic_points: [1.0e-3, 1.0e-1]
  grid: {x: ic, from: 1.0e-6, to: 10, per_decade: 5, unit: A}
  extraction: |
    dVBE/dT is the difference of VBE at 1 mA between 150 and −55 °C over 205 K. The gain ratios are
    hFE at 100, 125 and 150 °C and at −55 °C over hFE at 25 °C, at 1 mA and at 100 mA. A ratio of exactly
    1.000 is reported "absent" (no XTB), not as a number. The curves keep hFE, VBE, VCE(sat) and VBE(sat)
    against IC at each temperature, and the slope of VBE with temperature against IC over each span
    between neighbouring temperatures, the way one maker prints it.
  outputs:
  - {key: "dvbe_dt@1mA", unit: V/K, what: "slope of VBE with temperature at 1 mA"}
  - {key: "hfe_125_over_25@{ic}", unit: "", what: "hFE at 125 °C over hFE at 25 °C"}
  - {key: "hfe_100_over_25@{ic}", unit: "", what: "hFE at 100 °C over hFE at 25 °C"}
  - {key: "hfe_150_over_25@{ic}", unit: "", what: "hFE at 150 °C over hFE at 25 °C"}
  - {key: "hfe_m55_over_25@{ic}", unit: "", what: "hFE at −55 °C over hFE at 25 °C"}
  curves:
  - {name: "hFE, −55°C", x: ic, y: hfe, scale: log, unit: "", at: {T: -55}}
  - {name: "hFE, 25°C", x: ic, y: hfe, scale: log, unit: "", at: {T: 25}}
  - {name: "hFE, 100°C", x: ic, y: hfe, scale: log, unit: "", at: {T: 100}}
  - {name: "hFE, 125°C", x: ic, y: hfe, scale: log, unit: "", at: {T: 125}}
  - {name: "hFE, 150°C", x: ic, y: hfe, scale: log, unit: "", at: {T: 150}}
  - {name: "VBE, −55°C", x: ic, y: vbe, scale: lin, unit: V, at: {T: -55}}
  - {name: "VBE, 25°C", x: ic, y: vbe, scale: lin, unit: V, at: {T: 25}}
  - {name: "VBE, 100°C", x: ic, y: vbe, scale: lin, unit: V, at: {T: 100}}
  - {name: "VBE, 125°C", x: ic, y: vbe, scale: lin, unit: V, at: {T: 125}}
  - {name: "VBE, 150°C", x: ic, y: vbe, scale: lin, unit: V, at: {T: 150}}
  - {name: "VCE(sat), −55°C", x: ic, y: vcesat, scale: log, unit: V, at: {T: -55}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VCE(sat), 25°C", x: ic, y: vcesat, scale: log, unit: V, at: {T: 25}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VCE(sat), 100°C", x: ic, y: vcesat, scale: log, unit: V, at: {T: 100}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VCE(sat), 125°C", x: ic, y: vcesat, scale: log, unit: V, at: {T: 125}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VCE(sat), 150°C", x: ic, y: vcesat, scale: log, unit: V, at: {T: 150}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VBE(sat), −55°C", x: ic, y: vbesat, scale: lin, unit: V, at: {T: -55}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VBE(sat), 25°C", x: ic, y: vbesat, scale: lin, unit: V, at: {T: 25}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VBE(sat), 100°C", x: ic, y: vbesat, scale: lin, unit: V, at: {T: 100}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VBE(sat), 125°C", x: ic, y: vbesat, scale: lin, unit: V, at: {T: 125}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "VBE(sat), 150°C", x: ic, y: vbesat, scale: lin, unit: V, at: {T: 150}, grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}}
  - {name: "IC, −55°C", x: vbe, y: ic, scale: log, unit: A, at: {T: -55}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, 25°C", x: vbe, y: ic, scale: log, unit: A, at: {T: 25}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, 100°C", x: vbe, y: ic, scale: log, unit: A, at: {T: 100}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, 125°C", x: vbe, y: ic, scale: log, unit: A, at: {T: 125}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, 150°C", x: vbe, y: ic, scale: log, unit: A, at: {T: 150}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "dVBE/dT, −55 to 25°C", x: ic, y: dvbe_dt, scale: lin, unit: V/K, at: {span: "−55 to 25°C"}}
  - {name: "dVBE/dT, 25 to 100°C", x: ic, y: dvbe_dt, scale: lin, unit: V/K, at: {span: "25 to 100°C"}}
  - {name: "dVBE/dT, 100 to 125°C", x: ic, y: dvbe_dt, scale: lin, unit: V/K, at: {span: "100 to 125°C"}}
  - {name: "dVBE/dT, 125 to 150°C", x: ic, y: dvbe_dt, scale: lin, unit: V/K, at: {span: "125 to 150°C"}}
  select: {T: all, span: all}
  normalise:
  - {y: hfe, by: {id: bjt-hfe-ic, key: "hfe@1mA,5V"}, label: "hFE / hFE(1 mA, 5 V, 25 °C)"}
  hover:
  - {y: hfe, label: IB, unit: A, of: [x, "/", y], what: "the base current at that point, IC over hFE"}
  - {y: vcesat, label: P, unit: W, of: [x, "*", y], what: "power dissipated in the collector junction, VCE(sat) × IC"}
  - {y: ic, label: gm, unit: S, of: [dy, "/", dx], what: "transconductance, the local slope dIC/dVBE"}
  parameters: [XTB, XTI, EG, IS, NF]
  reads_high: |
    A gain that doubles between 25 and 125 °C is a high XTB (above 2); real silicon parts sit between
    1.3 and 1.8 times.
  reads_low: |
    A VBE slope smaller than 1.5 mV/K in magnitude says an EG or XTI that was changed from the
    defaults without reason. Gain ratios of exactly 1 are a card without XTB.
  cannot_tell: |
    Self-heating: the simulator holds the junction at the set temperature whatever the power; a real
    output transistor at 100 mA and 5 V is warmer than its heatsink. Leakage currents against
    temperature are below the simulators' floor and are not published.
  standard: resembles IEC 60747-7 temperature characteristics; data sheets print them as curve families
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the first deck at -55 °C; the 25 °C point comes from the hFE deck"
  - ".temp -55"
  - "* the second at 125 °C, the third at 150 °C"
  - ".temp 125"
  - "* the collector supply, 5 V"
  - "VT ct 0 5"
  - "* the base drive: 10 to the power of the dial, in amperes"
  - "BT 0 bt I=exp(2.302585092994046*V(x))"
  - "* the transistor, emitter grounded"
  - "QT ct bt 0 DUT"
  - "* the sweep: 1 nA to 1 A"
  - ".dc VX -9 0 0.05"

- id: bjt-breakdown
  kind: bjt
  group: breakdown
  name: Is there any breakdown, and what leaks
  symbols: [V(BR)CEO, V(BR)CBO, V(BR)EBO, ICBO, ICEO]
  what: |
    A plain Gummel-Poon card has no avalanche. Its collector current stays flat to any voltage, so a
    simulation will never show a stage dying at VCEO, a zener-connected emitter junction at 6 V, or
    an output stage failing on an inductive kick. The cards that do model breakdown are the
    exceptions: LTspice's BVcbo and BVbe extensions, VBIC's avalanche terms, QSPICE's higher levels.
    This measurement mostly documents an absence, and it is here because the absence is the single
    most dangerous thing to forget when a simulation is trusted near the ratings. The leakage currents
    of a model, ICBO and ICEO, are set by IS and by the simulator's own minimum conductance; they are
    far below those of a real part and are published only with that note.
  circuit: |
    Three sweeps. Collector to emitter with the base returned to the emitter through 1 MΩ, 0 to
    300 V. Collector to base with the emitter open, 0 to 300 V. Emitter to base reversed with the
    collector open, 0 to 30 V. The current in each is read against the voltage.
  drawing:
    file: bench/drawings/bjt-breakdown.svg
    elements: [DUT, swept voltage source, 1 MΩ base return (first sweep), ammeter]
    differs_from_netlist: the three sweeps are three decks; the drawing shows the collector-emitter one
  analysis: dc
  conditions:
    vce_sweep: {from: 0, to: 300, step: 1, unit: V}
    vcb_sweep: {from: 0, to: 300, step: 1, unit: V}
    veb_sweep: {from: 0, to: 30, step: 0.1, unit: V}
    breakdown_current: 1.0e-3
    leakage_points: {icbo: 10, iceo: 10, iebo: 5}
    temp_c: 25
  extraction: |
    The breakdown voltage is the first voltage at which the current exceeds 1 mA; when the sweep ends
    without that, the code is "absent" with the voltage reached. ICBO and ICEO at 10 V and IEBO at
    5 V are read directly, with a note when the value is below 10 pA (the floor the simulators'
    minimum conductance sets).
  outputs:
  - {key: vbr_ceo, unit: V, what: "collector-emitter breakdown with the base returned through 1 MΩ, or absent"}
  - {key: vbr_cbo, unit: V, what: "collector-base breakdown, emitter open, or absent"}
  - {key: vbr_ebo, unit: V, what: "emitter-base breakdown, collector open, or absent"}
  - {key: "icbo@10V", unit: A, what: "collector-base leakage at 10 V"}
  - {key: "iceo@10V", unit: A, what: "collector-emitter leakage at 10 V, base open"}
  - {key: "iebo@5V", unit: A, what: "emitter-base leakage at 5 V"}
  parameters: [BVCBO, NBVCBO, BVBE, IBVBE, NBVBE, IS, ISC, ISE]
  reads_high: ""
  reads_low: |
    A breakdown that appears means the card carries an extension or a higher-level model; the number
    is then worth comparing with the sheet. Leakage below 10 pA is the simulator, not the model.
  cannot_tell: |
    Anything about the real part's breakdown when the code is "absent": the model simply has no such
    physics. The simulators' minimum conductance (gmin, 1e-12 S) makes every leakage below about
    10 pA at 10 V meaningless.
  standard: resembles the breakdown voltage and cutoff current methods of MIL-STD-750-3
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* collector-base deck: a 0 V source from the swept node to the collector reads the current"
  - "VA sw ca 0"
  - "* the emitter open: 1 GΩ to ground"
  - "REA ea 0 1e9"
  - "* the transistor, base grounded"
  - "QA ca 0 ea DUT"
  - "* the sweep: 0 to 300 V in 1 V steps"
  - ".dc VSW 0 300 1"
  - "* collector-emitter deck: the base tied to the emitter through 1 MΩ"
  - "RBA ba 0 1e6"
  - "* the transistor, emitter grounded"
  - "QA ca ba 0 DUT"
  - "* emitter-base deck: the swept node drives the emitter"
  - "VA sw ea 0"
  - "* the collector open: 1 GΩ to ground"
  - "RCA ca 0 1e9"
  - "* the sweep: 0 to 30 V in 0.1 V steps"
  - ".dc VSW 0 30 0.1"
  - "* read: the voltage at which the current passes 1 mA, else absent; the leakage at 10 V (5 V for the emitter junction)"

- id: bjt-distortion
  kind: bjt
  group: distortion
  name: A reference stage's harmonic distortion (model against model only)
  symbols: [THD, HD2, HD3]
  what: |
    No data sheet gives a small-signal transistor's distortion, yet it is what audio users most want
    a model to predict. Distortion in a transistor stage comes from the curvature of its
    characteristics — the exponential VBE law, the gain changing with current, the Early effect, the
    capacitances changing with voltage — all of which the previous measurements describe one at a
    time. Here they act together in one fixed stage, so that two models of the same part can be
    compared, and a model that was fitted at one operating point can be told from one whose curvature
    is right. The stage is a textbook one: a common emitter with emitter degeneration, so that the
    exponential law is tamed by feedback and the gain curvature shows through.
  circuit: |
    The emitter current is set by an ideal 1 mA current source below a 260 Ω emitter resistor
    (gm·RE = 10 at 1 mA); the resistor's lower end is held at signal ground by a large capacitor, so the
    degeneration is the resistor alone. The collector feeds a 5 kΩ load resistor from 10 V, which puts
    VCE near 5 V. The base is driven through 1 kΩ. A first short run measures the gain, and the input
    amplitude is then set so that the output swings 1 V peak at 1 kHz; ten cycles are simulated and
    the last four analysed.
  drawing:
    file: bench/drawings/bjt-distortion.svg
    elements: [DUT, 1 mA current source under the emitter, emitter resistor 260 Ω bypassed to ground, load resistor 5 kΩ to 10 V, 1 kHz source with 1 kΩ, output probe on the collector]
    differs_from_netlist: nothing; the first gain-finding run is not drawn
  analysis: tran
  conditions:
    ie: 1.0e-3
    re: 260
    rl: 5000
    vcc: 10
    rs: 1000
    f: 1000
    vout_peak: 1
    cycles: 10
    analysed_cycles: 4
    steps_per_cycle: 4096
  extraction: |
    The output over the last four cycles is resampled onto a uniform grid and the amplitudes of
    harmonics 2 to 10 are taken by Goertzel's algorithm; THD is the root sum of squares of those over
    the fundamental. HD2 and HD3 are published separately because a differential stage cancels the
    first and not the second.
  outputs:
  - {key: thd, unit: "", what: "total harmonic distortion of the reference stage, 1 V peak out"}
  - {key: hd2, unit: "", what: "second harmonic over the fundamental"}
  - {key: hd3, unit: "", what: "third harmonic over the fundamental"}
  parameters: [IS, NF, BF, ISE, NE, IKF, VAF, CJC, CJE, RB, RE]
  reads_high: |
    Only against another model of the same part: the amplitude is fixed by the stage, not by the
    part, so the absolute figure is not a prediction of any circuit's distortion.
  reads_low: |
    With this degeneration the stage sits around half a percent, nearly all of it second harmonic;
    two models of one part that differ by a factor of two here differ in the curvature of their gain
    or in their Early voltage, which the DC measurements then show.
  cannot_tell: |
    The distortion of the real part, or of any other circuit. It is a comparison between models.
  standard: none
  pack: false
  engines: [qspice, ngspice]
  directives:
  - "* the supply, 10 V"
  - "VCC vcc 0 10"
  - "* the collector load, 5 kΩ"
  - "RL vcc c 5000"
  - "* the source resistance, 1 kΩ"
  - "RS in b 1000"
  - "* the emitter degeneration: 260 Ω, so that gm × RE = 10 at 1 mA"
  - "RE e x 260"
  - "* the bias: 1 mA from an ideal current source in the emitter"
  - "IE x vee 0.001"
  - "* the negative rail for that source"
  - "VEE vee 0 -5"
  - "* the transistor"
  - "Q1 c b e DUT"
  - "* the probe run: 20 mV at 1 kHz, to learn the stage's gain for this model"
  - "VIN in 0 SIN(0 0.02 1000)"
  - "* the measuring run: ten cycles of 1 kHz, the last four analysed; its input level (not shown) is set for 1 V peak out"
  - ".tran 2.44140625e-07 0.01 0 2.44140625e-07"

- id: bjt-agreement
  kind: bjt
  group: dc
  name: Do the three simulators agree?
  symbols: []
  what: |
    Not a circuit. Every number above is produced in QSPICE and in ngspice, and most in LTspice as
    well. Where the three agree to within 1 % the number is the model's; where one disagrees by more
    than 5 % the card is being read differently by that simulator — a unit it parses as something
    else, a parameter it clamps, an extension it ignores — and the result says which one is the odd
    one out and on which measurements. That is the "dialect" fact about a card, measured rather than
    guessed from its text.
  circuit: ""
  drawing: {file: "", elements: [], differs_from_netlist: ""}
  analysis: derived
  conditions: {tolerances: [0.01, 0.05], floors: {F: 1.0e-16, s: 1.0e-12}}
  extraction: |
    For each published output, the spread (max − min over the mean) across the engines that
    produced it, classed as within 1 %, within 5 % or beyond; values below the floors count as zero.
    The engine that is alone outside the band is the odd one out.
  outputs:
  - {key: agree_1pct, unit: "", what: "share of outputs on which every engine agrees within 1 %"}
  - {key: agree_5pct, unit: "", what: "share within 5 %"}
  - {key: odd_engine, unit: "", what: "the engine most often alone outside 5 %, or none"}
  - {key: disagreeing, unit: "", what: "the measurement ids where the engines differ by more than 5 %"}
  parameters: []
  reads_high: ""
  reads_low: ""
  cannot_tell: |
    Which engine is right. Agreement says the card means one thing to all three; disagreement says
    the card depends on the dialect, and the card's text (the capability layer) usually shows why.
  standard: none
  pack: false
  engines: [qspice, ngspice, ltspice]
