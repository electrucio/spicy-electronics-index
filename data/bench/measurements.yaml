  - {name: "tf, VCC=30V, 10µs", x: ic, y: tf, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-5}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tf, 100µs", x: ic, y: tf, scale: log, unit: s, at: {VCC: 10, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tf, VCC=30V, 100µs", x: ic, y: tf, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  select: {IC: 1.0e-1, VCC: 10, pulse: 3.0e-6}
  parameters: [TF, TR, CJE, CJC, RB, BF, BR, IKF]
  reads_high: |
    A storage time of microseconds at 100 mA is a slow switching transistor or a TR set for a power
    part; in a model of a 2N2369-class part it is wrong by two orders.
  reads_low: |
    A storage time near zero at every current is a card without TR: the model switches off with no
    stored charge. The code "absent" is used.
  cannot_tell: |
    The times with a speed-up capacitor, with an inductive load or with the sheet's own fixture
    values, all of which change them; the rows bench runs the sheet's own fixture when the sheet
    draws it. Transients also differ by up to 1 % between simulators because each chooses its own
    time steps.
  standard: resembles MIL-STD-750-3 pulse response and the JEDEC/MIL fixture of 2N2222A-type sheets, simplified
  pack: false
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the supply, 10 V"
  - "VCC vcc 0 10"
  - "* the load: 10 V over the switched current (100 Ω in the 100 mA deck)"
  - "RL vcc cs 100"
  - "* a 0 V source in the collector: reads IC"
  - "VS cs c 0"
  - "* the drive: -9.3 V until 100 ns, up to 10.7 V in 2 ns, back down at 3.1 µs"
  - "VIN in 0 PWL(0 -9.3 1e-07 -9.3 1.02e-07 10.7 3.102e-06 10.7 3.104e-06 -9.3)"
  - "* the base resistor: 100 V over the switched current, so that the drive gives IB = IC/10 on and off past a 0.7 V VBE"
  - "RB in b 1000"
  - "* the transistor, emitter grounded"
  - "Q1 c b 0 DUT"
  - "* steps of at most 0.25 ns, to 8.1 µs"
  - ".tran 2.5e-10 8.104e-06 0 2.5e-10"
  - "* one deck per switched current (10 mA to 10 A), supply (10 and 30 V) and pulse (3, 10 and 100 µs) scales VCC, RL and RB, and the pulse its step; td, tr, ts and tf are read from the 10 % and 90 % crossings of IC"

- id: bjt-noise
  kind: bjt
  group: noise
  name: Voltage noise, current noise, the 1/f corner and NF
  symbols: [en, in, NF]
  what: |
    The transistor's own noise, referred to its base so that it can be compared with the signal and
    the source. It has a voltage part — the shot noise of the collector current seen through the
    transistor's own 1/gm, plus the thermal noise of the base spreading resistance rbb' — and a
    current part, the shot noise of the base current. Below a corner frequency both are joined by
    flicker (1/f) noise, which rises as the frequency falls and sets what a preamplifier does at
    10 Hz. Low-noise design is the trade between the two: a low collector current for low current
    noise, a high one for low voltage noise, with the source resistance deciding which wins. In a
    card, the voltage floor needs RB (without it the model has only shot noise and is quieter than
    any real part at high currents), and the 1/f part needs KF and AF: a card with KF = 0 has no
    flicker noise at all, which is the single most common gap in library models.
  circuit: |
    A common-emitter stage at VCE = 5 V, the base biased by a current source for 10, 30, 100 and
    300 µA, 1, 3 and 10 mA, the collector currents low-noise sheets draw. The noise input is a voltage source in series with a source resistance RG at the base; the
    output is taken as the collector current through a sensing source. Two runs per current: RG = 0,
    which gives the voltage noise alone, and RG = 100 kΩ, from which the current noise is separated.
    A third run at 1 mA with RG = 1 kΩ gives the noise figure data sheets print.
  drawing:
    file: bench/drawings/bjt-noise.svg
    elements: [DUT, VCE source 5 V, base bias current source, noise voltage source in series with RG, output sensing in the collector]
    differs_from_netlist: the output is taken through a current-controlled voltage source into a 1 MΩ load, which is how the simulators report input-referred noise
  analysis: noise
  conditions:
    vce: 5
    ic_ladder: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2]
    rg: [0, 1.0e+5]
    nf: {ic: 1.0e-3, rg: 1000, f: 1000}
    band: [10, 1.57e+4]            # the wideband noise figure's band, as onsemi's and Philips' sheets take it
    f_points: [10, 100, 1000, 1.0e+4, 1.0e+5]
    noise_sweep: {from: 1, to: 1.0e+6, per_decade: 20, unit: Hz}
    temp_c: 25
  grid: {x: f, from: 1, to: 1.0e+6, per_decade: 5, unit: Hz}
  extraction: |
    en at each frequency point is the input-referred noise with RG = 0. With RG = 100 kΩ the input
    noise squared is en² + in²·RG² + 4kT·RG, from which in follows. The corner is the frequency at
    which en has risen to √2 times its 10 kHz value, "absent" when the spectrum is flat. NF at 1 kHz
    with RG = 1 kΩ is 10·log10 of the input noise squared over 4kT·RG. The floor ratio is en at
    10 mA over en at 100 µA at 10 kHz, which shows whether rbb' depends on current. The curves against
    source resistance are computed from en and in at 1 kHz, the way low-noise sheets draw them: the
    total input noise VT = √(en² + in²·RS² + 4kT·RS), and NF = 10·log10(VT² / 4kT·RS); the correlation
    between en and in is neglected, as those sheets neglect it. The wideband figure integrates the same
    densities over 10 Hz to 15.7 kHz: NF = 10·log10 of the integral of VT² over that of 4kT·RS, and the
    total noise voltage is the square root of the integral of VT², in volts.
  outputs:
  - {key: "en@{f},{ic}", unit: V/√Hz, what: "input voltage noise density", plotted: true}
  - {key: "in@{f},{ic}", unit: A/√Hz, what: "input current noise density", plotted: true}
  - {key: "en_corner@{ic}", unit: Hz, what: "frequency where en is √2 times its 10 kHz value"}
  - {key: "nf@1kHz,1mA,1k", unit: dB, what: "noise figure at 1 kHz, IC = 1 mA, RG = 1 kΩ"}
  - {key: en_floor_ratio, unit: "", what: "en at 10 mA over en at 100 µA, at 10 kHz"}
  - {key: "nf_wide@1mA,1k", unit: dB, what: "wideband noise figure, 10 Hz to 15.7 kHz, IC = 1 mA, RS = 1 kΩ"}
  curves:
  - {name: "en, 10µA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 1.0e-5}}
  - {name: "en, 30µA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 3.0e-5}}
  - {name: "en, 100µA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 1.0e-4}}
  - {name: "en, 300µA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 3.0e-4}}
  - {name: "en, 1mA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 1.0e-3}}
  - {name: "en, 3mA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 3.0e-3}}
  - {name: "en, 10mA", x: f, y: en, scale: log, unit: "V/√Hz", at: {IC: 1.0e-2}}
  - {name: "in, 10µA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 1.0e-5}}
  - {name: "in, 30µA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 3.0e-5}}
  - {name: "in, 100µA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 1.0e-4}}
  - {name: "in, 300µA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 3.0e-4}}
  - {name: "in, 1mA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 1.0e-3}}
  - {name: "in, 3mA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 3.0e-3}}
  - {name: "in, 10mA", x: f, y: in, scale: log, unit: "A/√Hz", at: {IC: 1.0e-2}}
  - {name: "en at 10Hz", x: ic, y: en, scale: log, unit: "V/√Hz", at: {f: 10}, grid: {x: ic, values: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2], unit: A}}
  - {name: "en at 100Hz", x: ic, y: en, scale: log, unit: "V/√Hz", at: {f: 100}, grid: {x: ic, values: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3, 3.0e-3, 1.0e-2], unit: A}}
