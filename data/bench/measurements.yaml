  - {name: "NF, 10µA", x: rs, y: nf, scale: lin, unit: dB, at: {IC: 1.0e-5, band: "spot 1 kHz"}, grid: {x: rs, from: 10, to: 1.0e+7, per_decade: 5, unit: "Ω"}}
