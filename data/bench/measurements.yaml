  select: {IB step: auto}
  family:                 # the five traces of one step are drawn together; at auto the key shows each model's step and the gain that set it
    note: "IB = k × step, k = 1 to 5"
    key: ib_step
    because: {id: bjt-hfe-ic, key: "hfe@10mA,5V", label: "hFE {value} at 10 mA, 5 V"}
  hover:                  # shown beside the point under the cursor
  - {y: ic, label: P, unit: W, of: [x, "*", y], what: "power dissipated in the transistor, VCE × IC"}
  - {y: ic, label: hFE, unit: "", of: [y, "/", ib], what: "the DC gain at that point, IC over the trace's base current"}
  - {y: ic, label: ro, unit: "Ω", of: [dx, "/", dy], what: "output resistance, the local slope of the trace"}
  parameters: [VAF, RC, BR, IKF, ISE, NE, BF]
  reads_high: |
    Traces that climb steeply along the flat part are a low Early voltage; a knee that reaches far to
    the right is a large collector resistance or a low reverse gain.
  reads_low: |
    Flat, parallel, equally spaced traces are a card with no VAF and a constant hFE: tidy, and unlike
    any transistor.
  cannot_tell: |
    The thermal droop a real tracer shows at high power (the model has no self-heating), and breakdown,
    which a plain Gummel-Poon card never reaches.
  standard: resembles the output characteristics every data sheet prints and a curve tracer draws; no test method
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* a 0 V source from the swept node to the first copy's collector: reads its IC"
  - "VK1 sw ck1 0"
  - "* the first auto copy; IK1 (not shown) feeds its base one auto step of base current, IK2 to IK5 two to five steps; the universal families are copies QU11 to QU165 fed by IU11 to IU165"
  - "QK1 ck1 bk1 0 DUT"
  - "* the collector supply of every copy, swept"
  - "VSW sw 0 0"
  - "* the sweep: 0 to 10 V in 20 mV steps"
  - ".dc VSW 0 10 0.02"
  - "* the auto step is a fifth of the base current that gave IC = 10 mA at 5 V in the hFE sweep; the universal steps are a 1-2-5 series from 1 µA to 100 mA"

- id: bjt-runs
  kind: bjt
  group: dc
  name: Does the card load?
  symbols: []
  what: |
    The first fact about a model: whether each simulator reads the card at all and finds one operating
    point. A card can fail for three different reasons, and the result says which: the text is not the
    dialect this simulator speaks (a parameter name it does not know, a unit it misreads), the solver
    cannot converge on it, or it took longer than the bench allows. A card that loads in one simulator
    and not in another is a dialect fact about the card, not a flaw in the simulator.
  circuit: |
    The transistor with its emitter grounded, a 5 V source on the collector and a 10 µA current source
    into the base: the simplest common-emitter bias. The collector current and the base-emitter voltage
    at that point are read and published, because they are the quickest sanity check of a model (a
    small-signal silicon transistor shows about 1 mA and about 0.65 V).
  drawing:
    file: bench/drawings/bjt-runs.svg
    elements: [DUT, VCE source 5 V, base current source 10 µA, ammeter in the collector, voltmeter base to emitter]
    differs_from_netlist: nothing
  analysis: op
  conditions: {vce: 5, ib: 1.0e-5, temp_c: 25}
  extraction: |
    The simulator's exit status and its log: a syntax message, a convergence message or a timeout become
    the error class. When it runs, IC and VBE at the operating point.
  outputs:
  - {key: runs, unit: "", what: "true when the simulator returned a solution"}
  - {key: error_class, unit: "", what: "syntax, convergence, timeout or empty when it ran"}
  - {key: ic_op, unit: A, what: "collector current at IB = 10 µA, VCE = 5 V"}
  - {key: vbe_op, unit: V, what: "base-emitter voltage at the same point"}
  parameters: []
  reads_high: ""
  reads_low: ""
  cannot_tell: |
    That the model is right: QSPICE in particular accepts cards with broken syntax and simulates
    something. "Runs" in one engine alone is weak evidence; agreement between engines is the stronger fact.
  standard: none
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the operating point is read on the hFE copy held at 5 V, at the step where the dial is -5: IB = 10 µA"
  - "* that copy's collector supply"
  - "VH1 ch1 0 5"
  - "* its base drive: a current source worth 10 to the power of the dial V(x), in amperes"
  - "BH1 0 bh1 I=exp(2.302585092994046*V(x))"
  - "* the transistor, emitter grounded"
  - "QH1 ch1 bh1 0 DUT"
  - "* the dial: a node whose voltage is the decade of the drive; nothing else reads it"
  - "VX x 0 0"
  - "* the sweep: the dial from -9 to 0 in steps of 0.05, so the drive runs 1 nA to 1 A at twenty points per decade"
  - ".dc VX -9 0 0.05"
  - "* the solver's relative tolerance, tighter than the default"
  - ".options reltol=1e-4"

- id: bjt-gummel
  kind: bjt
  group: dc
  name: The Gummel plot — IC and IB against VBE at VCB = 0
  symbols: [IS, n, hFE]
  what: |
    The textbook picture of a bipolar transistor, and the plot its models are fitted on. Both the
    collector current and the base current rise exponentially with the base-emitter voltage, so on a
    logarithmic current axis they are two straight lines. The vertical distance between them is the
    current gain hFE. The slope of the collector line is set by physics (about 60 mV per decade at
    25 °C), and how close the model keeps to it is the ideality factor n; its intercept is the
    saturation current IS, the number that decides VBE for a given current. The two lines are not
    straight for ever: at low currents the base line bends up (recombination in the emitter junction,
    which costs gain), and at high currents the collector line bends over (high injection and series
    resistance, which costs gain again). Where those bends sit is what separates a model fitted to
    measurements from one written from the headline numbers.
  circuit: |
    The base node is fed by a current source that walks a decade every twenty points from 1 nA to 1 A.
    The collector is tied to the base through a 0 V source, so the collector-base voltage is zero and
    VCE equals VBE at every point — the condition the plot is defined at. The emitter is grounded. The
    source feeds base and collector together: the collector current is read through the 0 V source,
    the base current is what the source gives less that, and VBE is read at the base.
  drawing:
    file: bench/drawings/bjt-gummel.svg
    elements: [DUT, base current source swept 1 nA to 1 A, 0 V source collector to base (ammeter), voltmeter base to emitter]
    differs_from_netlist: the base source is a behavioural source IB = 10^V(x) swept through V(x); it is drawn as a plain current source
  analysis: dc
  conditions: {ib_sweep: {from: 1.0e-9, to: 1, per_decade: 20, unit: A}, vcb: 0, temp_c: 25}
  grid: {x: vbe, from: 0.1, to: 1.0, step: 0.02, unit: V}
  extraction: |
    Over the straight part of the collector line (IC between 10 µA and 1 mA, or the widest window that
    stays within 2 % of a straight fit) the slope in mV per decade gives n = slope / 59.2 mV, and the
    intercept gives IS. hFE is IC/IB at each point; its peak and the current at the peak are kept. The
    low-current ratio is hFE at 1 µA over the peak; the high-injection knee is the collector current at
    which hFE has fallen to half its peak on the high side, or "n/a" when it never does within the sweep.
    The two curves are the classic plot: IC and IB against VBE, on a 20 mV grid and a log scale, so
    that an ideal junction climbs 59 mV per decade and the gap between the lines is hFE.
  outputs:
  - {key: is_fit, unit: A, what: "saturation current from the intercept of the collector line"}
  - {key: n_fit, unit: "", what: "ideality factor from the slope of the collector line"}
  - {key: fit_window, unit: A, what: "the two collector currents the fit was taken between"}
  - {key: hfe_peak, unit: "", what: "the highest IC/IB along the sweep"}
  - {key: ic_at_hfe_peak, unit: A, what: "collector current at that peak"}
  - {key: hfe_low_ratio, unit: "", what: "hFE at IC = 1 µA divided by the peak"}
  - {key: ikf_knee, unit: A, what: "collector current where hFE is half its peak on the high side"}
  curves:
  - {name: IC, x: vbe, y: ic, scale: log, unit: "A"}
  - {name: IB, x: vbe, y: ib, scale: log, unit: "A"}
  family:                 # drawn together: the two lines of the Gummel plot, IC above IB
    note: "IC (upper line) and IB (lower line) against VBE at VCB = 0"
  hover:
  - {y: ic, label: gm, unit: S, of: [dy, "/", dx], what: "transconductance, the local slope dIC/dVBE"}
  parameters: [IS, NF, BF, ISE, NE, IKF, NK, RB, RE]
  reads_high: |
    A high n (above 1.1) says the model's VBE moves more than physics per decade of current, which
    shows up as a wrong VBE at currents far from where it was fitted. A high hFE peak with a flat low
    side (ratio near 1) says no recombination term: the model keeps its gain at microamps, which real
    small-signal parts do not.
  reads_low: |
    A knee that sits at a few milliamps in a model of a power transistor means IKF was set too low, and
    the model will understate the gain at the currents the part is used at; a knee that never comes
    means IKF is absent, and the model will flatter an output stage.
  cannot_tell: |
    Anything about the collector voltage: the plot is taken at VCB = 0, so the Early effect is not in
    it. The hFE of a data sheet, taken at a fixed VCE, is the next measurement.
  standard: none — a model-extraction plot (Gummel and Poon, 1970), not a data-sheet test
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the dial: a node whose voltage is the decade of the drive; nothing else reads it"
  - "VX x 0 0"
  - "* the drive: 10 to the power of the dial, in amperes, into the base node, from which base and collector draw"
  - "BG 0 bg I=exp(2.302585092994046*V(x))"
  - "* a 0 V source from collector to base: VCB = 0, and the current through it is IC"
  - "VG cg bg 0"
  - "* the transistor, emitter grounded"
  - "QG cg bg 0 DUT"
  - "* the sweep: the dial from -9 to 0 in steps of 0.05, 1 nA to 1 A at twenty points per decade"
  - ".dc VX -9 0 0.05"
  - "* read: IC through VG, IB as the drive less IC, VBE as the voltage of the base node"

- id: bjt-hfe-ic
  kind: bjt
  group: dc
  name: DC current gain hFE and VBE against collector current, at fixed VCE
  symbols: [hFE, VBE(on)]
  what: |
    The same current gain, measured the way data sheets print it: the collector held at a fixed
    voltage and hFE read at a few collector currents. This is where "hFE = 100 to 300 at 10 mA, 1 V"
    and "VBE(on) = 0.65 V at 1 mA" come from. Three collector voltages are used, because the Early
    effect makes the gain rise with VCE and the amount it rises is a property of the model. Two
    numbers derived from the curve matter beyond any single point: where the gain peaks, which says
    what current the transistor is happiest at, and how flat it is across the decade an amplifier
    stage uses, which is the first-order source of distortion in a stage without feedback.
  circuit: |
    Three copies of the transistor, each with its emitter grounded and its collector held by a voltage
    source at 1 V, 5 V and 10 V. Each base is fed by the same swept current source as the Gummel plot,
    1 nA to 1 A. The collector currents and the base-emitter voltages are read along the sweep; hFE and
    VBE are then read off the curves at each decade of collector current.
  drawing:
    file: bench/drawings/bjt-hfe-ic.svg
    elements: [DUT, "VCE source (1, 2, 4, 5, 6 or 10 V)", swept base current source, ammeter in the collector, voltmeter base to emitter]
    differs_from_netlist: the six VCE copies run in one deck; the drawing shows one, with the voltages listed
  analysis: dc
  conditions:
    ib_sweep: {from: 1.0e-9, to: 1, per_decade: 20, unit: A}
    vce: [1, 5, 10, 2, 4, 6]       # the first three keep their copy names (the directives quote them); the voltages data sheets use
    ic_ladder: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10]
    temp_c: 25
  grid: {x: ic, from: 1.0e-6, to: 10, per_decade: 5, unit: A}
  extraction: |
    For each VCE, the base current and VBE at each ladder current are interpolated along the sweep
    (logarithmically for the currents, linearly in log IC for VBE); hFE is IC over that base current.
    A value no transistor has (hFE above 10,000, or VBE outside 0.2 to 1.6 V) is marked suspect: it is
    the behavioural base drive settling on a wrong solution in one engine for cards with a base
    resistance near zero, and it is kept out of the numbers. A sweep whose collector current stops
    rising with base current and falls is cut at that peak, because reading the falling branch would mix
    two base currents for one collector current. When the peak sits at the same current at 5 and 10 V it
    is the card's own ceiling (NK above 1), published as ic_peak; a peak that moves with VCE is the
    transistor saturated through its own emitter and collector resistances by a base current no circuit
    applies, which is physics, and is not published. The peak and the current at the peak come
    from the 5 V curve; IC is also drawn against VBE, on a VBE grid, the way the "IC against VBE" charts of
    the sheets put it; the flatness is the largest hFE over the smallest between 100 µA and 10 mA at
    5 V; the Early signature is hFE at 1 mA and 10 V over hFE at 1 mA and 1 V.
  outputs:
  - {key: "hfe@{ic},{vce}", unit: "", what: "DC current gain at each ladder current and collector voltage", plotted: true}
  - {key: "vbe@{ic},{vce}", unit: V, what: "base-emitter voltage at the same points", plotted: true}
  - {key: hfe_peak, unit: "", what: "highest hFE on the 5 V curve"}
  - {key: ic_at_hfe_peak, unit: A, what: "collector current at that peak"}
  - {key: hfe_flatness, unit: "", what: "max/min of hFE between 100 µA and 10 mA at 5 V"}
  - {key: hfe_10v_over_1v, unit: "", what: "hFE at 1 mA, 10 V over hFE at 1 mA, 1 V (the Early effect)"}
  - {key: ic_peak, unit: A, what: "the collector current at which IC stopped rising with base current and fell, at the same current at 5 and 10 V: a ceiling no transistor has (NK > 1 cards); not produced when IC rose to the end of the sweep, or when the peak moves with VCE or shows at one voltage only (the transistor saturated through its own resistances by an absurd drive)"}
  curves:
  - {name: "hFE, VCE=1V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 1}}
  - {name: "hFE, VCE=2V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 2}}
  - {name: "hFE, VCE=4V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 4}}
  - {name: "hFE, VCE=5V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 5}}
  - {name: "hFE, VCE=6V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 6}}
  - {name: "hFE, VCE=10V", x: ic, y: hfe, scale: log, unit: "", at: {VCE: 10}}
  - {name: "VBE, VCE=1V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 1}}
  - {name: "VBE, VCE=2V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 2}}
  - {name: "VBE, VCE=4V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 4}}
  - {name: "VBE, VCE=5V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 5}}
  - {name: "VBE, VCE=6V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 6}}
  - {name: "VBE, VCE=10V", x: ic, y: vbe, scale: lin, unit: "V", at: {VCE: 10}}
  - {name: "IC, VCE=1V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 1}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, VCE=2V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 2}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, VCE=4V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 4}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, VCE=5V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 5}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, VCE=6V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 6}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  - {name: "IC, VCE=10V", x: vbe, y: ic, scale: log, unit: "A", at: {VCE: 10}, grid: {x: vbe, from: 0.1, to: 1.2, step: 0.02, unit: V}}
  select: {VCE: 5}
  normalise:              # the gain as some makers print it: relative to its value at 1 mA, 5 V, 25 °C
  - {y: hfe, by: {id: bjt-hfe-ic, key: "hfe@1mA,5V"}, label: "hFE / hFE(1 mA, 5 V, 25 °C)"}
  hover:
  - {y: hfe, label: IB, unit: A, of: [x, "/", y], what: "the base current at that point, IC over hFE"}
  - {y: hfe, label: P, unit: W, of: [x, "*", at.VCE], what: "power dissipated in the transistor, VCE × IC"}
  - {y: ic, label: gm, unit: S, of: [dy, "/", dx], what: "transconductance, the local slope dIC/dVBE"}
  - {y: ic, label: P, unit: W, of: [y, "*", at.VCE], what: "power dissipated in the transistor, VCE × IC"}
  - {y: vbe, label: gm, unit: S, of: [dx, "/", dy], what: "transconductance, the local slope dIC/dVBE"}
  parameters: [BF, ISE, NE, IKF, NK, VAF, RB, RE, IS, NF]
  reads_high: |
    A high flatness ratio (above 1.5 over two decades) is a gain that moves a lot with signal current:
    more distortion in an undegenerated stage, and a bias point that drifts with level. A high ratio
    between 10 V and 1 V means a low Early voltage.
  reads_low: |
    A flatness of exactly 1.00 is a gain that does not move at all, which only a card with neither ISE
    nor IKF produces; it is a model nobody fitted to a curve. hFE at 1 µA far below the peak is normal
    for a real part and absent in most cards.
  cannot_tell: |
    What the part does: a data sheet gives hFE as a range of production spread (100 to 300), and one
    model is one point in it. Comparing this number with the sheet is the comparison step, not this one.
  standard: resembles MIL-STD-750-3 (forward-current transfer ratio) and IEC 60747-7 static characteristics
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the collector supply of the first copy: 1 V"
  - "VH0 ch0 0 1"
  - "* of the second: 5 V, the copy the summary values come from"
  - "VH1 ch1 0 5"
  - "* of the third: 10 V"
  - "VH2 ch2 0 10"
  - "* the base drive of the 5 V copy: 10 to the power of the dial V(x), in amperes; the other copies have their own, reading the same dial"
  - "BH1 0 bh1 I=exp(2.302585092994046*V(x))"
  - "* the 5 V copy, emitter grounded"
  - "QH1 ch1 bh1 0 DUT"
  - "* the dial: a node whose voltage is the decade of the drive; nothing else reads it"
  - "VX x 0 0"
  - "* the sweep: 1 nA to 1 A at twenty points per decade"
  - ".dc VX -9 0 0.05"
  - "* read at each ladder current: hFE = IC / IB, IC being the collector supply's current, and VBE the base voltage"

- id: bjt-hfe-ac
  kind: bjt
  group: dc
  name: AC current gain hfe against collector current, at 1 kHz
  symbols: [hfe]
  what: |
    The small-signal current gain: how much the collector current moves for a small wiggle of the base
    current, hfe = Δic / Δib, taken at 1 kHz where no capacitance matters yet. It is the gain an amplifier
    stage actually uses, and the one small-signal data sheets print as hfe or h21e. It is not the DC gain
    of the chart above: hFE is the ratio IC / IB, hfe the slope of IC against IB, so hfe runs above hFE
    where the gain is still rising with current and below it where the gain falls, and the two meet only
    where hFE is flat. A model whose DC gain bends shows the bend here, exaggerated.
  circuit: |
    The fT deck's copies, read at 1 kHz: one copy per ladder current at VCE = 5 V and at 10 V, each with its DC base
    current and 1 A of AC on top; the AC collector current is |h21|, which at 1 kHz is hfe.
  drawing:
    file: bench/drawings/bjt-hfe-ac.svg
    elements: [DUT, VCE source 5 V, base bias current source with a small AC signal on top, ammeter in the collector]
    differs_from_netlist: the deck runs one copy per ladder current; the drawing shows one; the AC drive of 1 A is the simulator's unit signal, not a real amplitude
  analysis: ac
  conditions:
    vce: [5, 10]
    ic_ladder: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10]
    f: 1000
  grid: {x: ic, values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10], unit: A}
  extraction: |
    hfe at each ladder current is |h21| at 1 kHz: the AC collector current over the 1 A of AC base
    current. The ratio of hfe to hFE at 1 mA is kept: 1.0 where the DC gain is flat, above it where the
    gain rises with current, below it where it falls.
  outputs:
  - {key: "hfe_ac@{ic},{vce}", unit: "", what: "small-signal current gain at 1 kHz, at 5 and at 10 V", plotted: true}
  - {key: "hfe_ac_over_hfe@1mA", unit: "", what: "AC gain over DC gain at 1 mA, 5 V: the slope of hFE against IC"}
  curves:
  - {name: "hfe at 1 kHz, VCE=5V", x: ic, y: hfe_ac, scale: log, unit: "", at: {VCE: 5}}
  - {name: "hfe at 1 kHz, VCE=10V", x: ic, y: hfe_ac, scale: log, unit: "", at: {VCE: 10}}
  select: {VCE: 5}
  hover:
  - {y: hfe_ac, label: P, unit: W, of: [x, "*", at.VCE], what: "power dissipated in the transistor, VCE × IC"}
  parameters: [BF, ISE, NE, IKF, NK, VAF, TF]
  reads_high: |
    An AC gain well above the DC gain at the same current is a gain still climbing steeply with current:
    the low-current fall (ISE, NE) reaching up to the operating point.
  reads_low: |
    An AC gain well below the DC gain is the high-current fall (IKF) already at work; equal to it, a flat
    gain. An hfe that collapses at a ladder step before fT does is a card whose collector current has a
    ceiling.
  cannot_tell: |
    The gain at higher frequencies, which is the fT measurement; and any dependence on VCE, since only
    5 V is run here.
  standard: resembles the small-signal forward current transfer ratio (hfe, h21e) method of MIL-STD-750-3, at 1 kHz
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the collector supply of the first copy, 5 V; its current is the collector current, DC and AC"
  - "VCT0 ct0 0 5"
  - "* the first copy; IBT0 (not shown) feeds its base the DC current for the ladder step with 1 A of AC on top; one copy per step"
  - "QT0 ct0 bt0 0 DUT"
  - "* twenty points per decade from 1 kHz to 100 GHz: the fT deck, read here at its first point"
  - ".ac dec 20 1000 1e+11"
  - "* read: hfe = the AC collector current over the 1 A of AC base current, at 1 kHz"

- id: bjt-early
  kind: bjt
  group: dc
  name: Output characteristics, Early voltage and the 1 kHz h-parameters
  symbols: [VA, hoe, hie, hre, hfe]
  what: |
    The family of curves on the first page of every transistor chapter: collector current against
    collector voltage at a few fixed base currents. In a real transistor the curves are not flat — the
    collector current keeps rising slowly with voltage, because a wider collector depletion layer
    narrows the base. Extrapolated backwards, the curves meet the voltage axis at one point, the Early
    voltage VA, and VA over IC is the output resistance of the transistor: what limits the gain of a
    stage with a current-source load and the quality of a current mirror. A card without VAF draws
    perfectly flat lines, an infinite output resistance that no transistor has, and a simulated
    cascode or mirror built on it will look better than the real one. The same deck reads the knee
    where each curve leaves saturation, and a small AC run at 1 mA gives the four h-parameters at
    1 kHz that older data sheets print (hie, hre, hfe, hoe).
  circuit: |
    Four copies of the transistor, emitters grounded, each with a fixed base current chosen from the
    previous measurement so that the collector current is about 100 µA, 1 mA, 10 mA and 100 mA at
    VCE = 5 V. One voltage source sweeps all four collectors from 0 to 30 V. For the h-parameters, two
    more copies at IB for 1 mA and VCE = 5 V: one driven by a small AC current into the base with the
    collector held (hie and hfe), one with the base current held and a small AC voltage on the
    collector (hre and hoe).
  drawing:
    file: bench/drawings/bjt-early.svg
    elements: [DUT, fixed base current source, swept VCE source 0 to 30 V, ammeter in the collector, 'h-parameter copies A (base driven) and B (collector driven), each with a base voltmeter']
    differs_from_netlist: the four base currents run as four copies in one deck, drawn as one transistor; the h-parameter deck's two copies are the second row of the drawing
  analysis: dc
  conditions:
    vce_sweep: {from: 0, to: 30, step: 0.05, unit: V}
    ic_targets: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
    h_parameters: {ic: 1.0e-3, vce: 5, f: 1000}
    temp_c: 25
  grid: {x: vce, from: 1, to: 30, step: 1, unit: V}
  extraction: |
    For each curve, the slope between 5 and 10 V gives VA = IC/(dIC/dVCE) − VCE taken at 5 V; the output
    admittance hoe is that slope on the 1 mA curve; the knee is the voltage where IC first reaches 90 %
    of its value at 5 V. A VA above 10,000 V is reported as "absent" (no Early effect), not as a
    number. The h-parameters are read from the AC deck at 1 kHz as the existing rows bench does.
  outputs:
  - {key: "va@{ic}", unit: V, what: "Early voltage from the slope between 5 and 10 V"}
  - {key: "hoe@1mA,5V", unit: S, what: "output admittance from the DC slope"}
  - {key: "vce_knee@{ic}", unit: V, what: "collector voltage where the curve leaves saturation"}
  - {key: "hie@1mA", unit: Ω, what: "input impedance at 1 kHz, output shorted"}
  - {key: "hre@1mA", unit: "", what: "reverse voltage transfer ratio at 1 kHz"}
  - {key: "hoe_ac@1mA", unit: S, what: "output admittance at 1 kHz"}
  curves:
  - {name: "IC, 100µA", x: vce, y: ic, scale: lin, unit: "A", at: {IC: 1.0e-4}}
  - {name: "IC, 1mA", x: vce, y: ic, scale: lin, unit: "A", at: {IC: 1.0e-3}}
  - {name: "IC, 10mA", x: vce, y: ic, scale: lin, unit: "A", at: {IC: 1.0e-2}}
  - {name: "IC, 100mA", x: vce, y: ic, scale: lin, unit: "A", at: {IC: 1.0e-1}}
  select: {IC: all}
  hover:
  - {y: ic, label: P, unit: W, of: [x, "*", y], what: "power dissipated in the transistor, VCE × IC"}
  - {y: ic, label: ro, unit: "Ω", of: [dx, "/", dy], what: "output resistance, the local slope of the trace"}
  parameters: [VAF, VAR, RC, IKF, BF]
  reads_high: |
    A VA of several hundred volts is a stiff current source and a high-gain stage; most small-signal
    NPNs sit between 50 and 150 V, PNPs lower, and a model far above the part's own figure will
    overstate voltage gain.
  reads_low: |
    A VA below 20 V is a soft transistor, or a card whose VAF was set from a sheet's hoe at the wrong
    current. A knee above 1 V at 10 mA says a large collector resistance.
  cannot_tell: |
    Breakdown: the sweep stops at 30 V and a plain card has no avalanche anyway (see the breakdown
    measurement). Nor the reverse Early voltage, which only shows in saturation.
  standard: resembles the output admittance (hoe) and h-parameter methods of MIL-STD-750-3, read from DC
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* a 0 V source from the swept node to the first copy's collector: reads its IC"
  - "VE0 sw ce0 0"
  - "* the first copy; IE0 (not shown, from the hFE sweep) feeds its base the current that gave IC = 100 µA at 5 V; three more copies for 1, 10 and 100 mA"
  - "QE0 ce0 be0 0 DUT"
  - "* the collector supply of every copy, swept"
  - "VSW sw 0 0"
  - "* the sweep: 0 to 30 V in steps of 50 mV"
  - ".dc VSW 0 30 0.05"
  - "* the h-parameter deck: copy A biased at 5 V"
  - "VCA ca 0 5"
  - "* copy A, its base fed the DC current for 1 mA plus 1 A of AC (IBA, not shown): hie and hfe"
  - "QA ca ba 0 DUT"
  - "* copy B's collector supply, 5 V plus 1 V of AC, the output side driven: hre and hoe"
  - "VCB cb 0 DC 5 AC 1"
  - "* ten points per decade from 100 Hz to 10 kHz; the four parameters are read at 1 kHz"
  - ".ac dec 10 100 10000"

- id: bjt-saturation
  kind: bjt
  group: high-current
  name: VCE(sat) and VBE(sat) against collector current at forced hFE = 10, 20 and 50
  symbols: [VCE(sat), VBE(sat)]
  what: |
    How low the collector can be pulled when the transistor is driven hard: the figure that sets the
    loss of a saturated switch and the clipping floor of an output stage. Data sheets measure it with
    the base over-driven so that IC/IB = 10 (Toshiba, ST, onsemi), 20 (Nexperia) or 50 (Diodes), and
    print it at one or two currents; a Darlington uses 250, which is not run here. Two
    things make up the curve. At low currents VCE(sat) has a floor of a few tens of millivolts set by
    the reverse gain BR — the transistor in saturation is two forward-biased junctions, and the floor
    is the difference of their voltages. At high currents the curve rises along a straight line whose
    slope is the collector resistance RC (plus a share of RE): the ohmic part of the collector that
    no amount of base drive removes. A card with RC = 0 and a default BR has a VCE(sat) that neither
    rises with current nor has a realistic floor, and it will understate the loss of a switch and the
    heat of an output stage at full swing.
  circuit: |
    Two matched current sources: one into the base, one into the collector carrying exactly ten times
    the base current, both walking the same sweep; two more copies carry twenty and fifty times. A diode
    from the collector to a 30 V source catches
    the collector of a transistor that cannot sink ten times its base current at that point, so the
    sweep passes through saturation without the solver failing; a point at which the collector sits at
    the clamp is reported "not saturated". The collector and base voltages are read along the sweep.
  drawing:
    file: bench/drawings/bjt-saturation.svg
    elements: [DUT, base current source IB, collector current source 10·IB, clamp diode to 30 V, voltmeters collector and base to emitter]
    differs_from_netlist: the sources are behavioural (IB = 10^V(x)); the copies at 10, 20 and 50 times the base current are drawn as one with n
  analysis: dc
  conditions:
    ib_sweep: {from: 1.0e-8, to: 1, per_decade: 20, unit: A}
    forced_hfe: [10, 20, 50]       # the first keeps its copy names (the directives quote them) and gives the floor and the slope
    clamp_v: 30
    ic_ladder: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10]
    temp_c: 25
  grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}
  extraction: |
    VCE(sat) and VBE(sat) interpolated at each ladder current where the transistor was saturated: the
    collector below the clamp, and VCE below VBE (the collector junction forward-biased); a step where
    the collector sits higher is the transistor in its active region, unable to pass the forced
    current, and is left out. The floor is VCE(sat) at 100 µA; the saturation resistance is the slope
    dVCE(sat)/dIC between 100 mA and 1 A, or between the two highest currents that saturated.
  outputs:
  - {key: "vcesat@{ic},{ratio}", unit: V, what: "collector-emitter saturation voltage at each ladder current, at IC/IB = 10, 20 or 50", plotted: true}
  - {key: "vbesat@{ic},{ratio}", unit: V, what: "base-emitter voltage at the same points", plotted: true}
  - {key: vce_sat_floor, unit: V, what: "VCE(sat) at 100 µA, IC/IB = 10"}
  - {key: rce_sat, unit: Ω, what: "slope of VCE(sat) with IC at high current, IC/IB = 10"}
  curves:
  - {name: "VCE(sat), IC/IB=10", x: ic, y: vcesat, scale: log, unit: "V", at: {IC/IB: 10}}
  - {name: "VCE(sat), IC/IB=20", x: ic, y: vcesat, scale: log, unit: "V", at: {IC/IB: 20}}
  - {name: "VCE(sat), IC/IB=50", x: ic, y: vcesat, scale: log, unit: "V", at: {IC/IB: 50}}
  - {name: "VBE(sat), IC/IB=10", x: ic, y: vbesat, scale: lin, unit: "V", at: {IC/IB: 10}}
  - {name: "VBE(sat), IC/IB=20", x: ic, y: vbesat, scale: lin, unit: "V", at: {IC/IB: 20}}
  - {name: "VBE(sat), IC/IB=50", x: ic, y: vbesat, scale: lin, unit: "V", at: {IC/IB: 50}}
  select: {IC/IB: 10}
  hover:
  - {y: vcesat, label: P, unit: W, of: [x, "*", y], what: "power dissipated in the collector junction, VCE(sat) × IC"}
  - {y: vcesat, label: IB, unit: A, of: [x, "/", at.IC/IB], what: "the base current that forces it, IC over the ratio"}
  - {y: vbesat, label: IB, unit: A, of: [x, "/", at.IC/IB], what: "the base current that forces it, IC over the ratio"}
  parameters: [BR, NR, RC, RE, IKF, IKR, VAR]
  reads_high: |
    A saturation resistance of an ohm or more in a small-signal part is plausible; in a model of a
    10 A power transistor it means the model cannot be driven into a realistic VCE(sat) at rated
    current, and a simulated switch built on it dissipates far too much. A floor above 100 mV says a
    very small BR.
  reads_low: |
    A slope of zero (the curve flat to 10 A) means RC is absent. A floor near zero means a default BR
    that nobody set: the model has not been fitted in saturation.
  cannot_tell: |
    Quasi-saturation, the soft region between active and hard saturation that power transistors show:
    the plain Gummel-Poon model has no term for it (PSpice and LTspice carry an extension that only
    some cards use).
  standard: resembles MIL-STD-750-3 saturation voltage methods; IC/IB = 10 is the usual data-sheet condition
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the base drive: 10 to the power of the dial, in amperes"
  - "BSB 0 bs I=exp(2.302585092994046*V(x))"
  - "* the collector drive: ten times the base drive, pulled out of the collector (hFE forced to 10)"
  - "BSC 0 cs I=10*exp(2.302585092994046*V(x))"
  - "* a clamp diode from the collector node to 30 V: what the transistor cannot pass goes this way"
  - "DCL cs cl DCLMP"
  - "* the 30 V the clamp holds"
  - "VCL cl 0 30"
  - "* the transistor, emitter grounded"
  - "QS cs bs 0 DUT"
  - "* the sweep: IB 1 nA to 1 A, IC ten times that"
  - ".dc VX -9 0 0.05"
  - "* read: VCE(sat) as the collector voltage, VBE(sat) as the base voltage; a step where the clamp conducts, or where VCE is not below VBE, is not saturated"

- id: bjt-vce-ib
  kind: bjt
  group: high-current
  name: The saturation region — VCE against base current at fixed collector current
  symbols: [VCE(IB)]
  what: |
    The chart one maker prints under "collector saturation region": the collector voltage against the
    base current while the collector current is held fixed. Read from right to left it is the story of
    a switch turning on: with little base drive the transistor cannot pass the current and the collector
    sits high; as the base current rises past IC over hFE the collector voltage collapses, first steeply,
    then along the slow tail of hard saturation that the reverse gain and the collector resistance set.
    It tells the designer how much base current a switch needs for a given collector current, and how
    much more buys how little. A card without a fitted BR and RC shows the collapse but not the tail,
    and a card whose hFE is wrong puts the knee at the wrong base current.
  circuit: |
    One copy per collector current, 1 mA to 10 A: a current source pulls the collector current through the
    transistor from a 30 V rail by way of a clamp diode, so that a transistor unable to pass it has its
    collector caught at 30 V rather than the solver failing; the base is driven by the log sweep of base
    current. The collector voltage is read along the sweep; the points at which the clamp conducts are
    the transistor still off and are not published.
  drawing:
    file: bench/drawings/bjt-vce-ib.svg
    elements: [DUT, fixed collector current source with a clamp diode to 30 V, swept base current source, voltmeter collector to emitter]
    differs_from_netlist: the seven collector currents run as copies in one deck, drawn as one; the base drive is behavioural (IB = 10^V(x))
  analysis: dc
  conditions:
    ic_ladder: [1.0e-3, 1.0e-2, 1.0e-1, 1, 2, 5, 10]    # 2, 5 and 10 A for power parts, as onsemi's Darlington sheets draw them
    ib_sweep: {from: 1.0e-9, to: 1, per_decade: 20, unit: A}
    clamp_v: 30
    edge_v: 1                       # the collector voltage at which the base current is read as the edge of saturation
    temp_c: 25
  grid: {x: ib, from: 1.0e-7, to: 1, per_decade: 5, unit: A}
  extraction: |
    VCE on the base-current grid for each collector current, where the collector sat below the clamp.
    The base current at which VCE first falls to 1 V, the edge of saturation a designer sizes the base
    drive from, is kept per collector current; a copy whose collector never came off the clamp is "n/a".
  outputs:
  - {key: "ib_edge@{ic}", unit: A, what: "the base current at which VCE has fallen to 1 V, the edge of saturation, at each collector current"}
  curves:
  - {name: "VCE, IC=1mA", x: ib, y: vce, scale: lin, unit: V, at: {IC: 1.0e-3}}
  - {name: "VCE, IC=10mA", x: ib, y: vce, scale: lin, unit: V, at: {IC: 1.0e-2}}
  - {name: "VCE, IC=100mA", x: ib, y: vce, scale: lin, unit: V, at: {IC: 1.0e-1}}
  - {name: "VCE, IC=1A", x: ib, y: vce, scale: lin, unit: V, at: {IC: 1}}
  - {name: "VCE, IC=2A", x: ib, y: vce, scale: lin, unit: V, at: {IC: 2}}
  - {name: "VCE, IC=5A", x: ib, y: vce, scale: lin, unit: V, at: {IC: 5}}
  - {name: "VCE, IC=10A", x: ib, y: vce, scale: lin, unit: V, at: {IC: 10}}
  select: {IC: all}
  hover:
  - {y: vce, label: P, unit: W, of: [y, "*", at.IC], what: "power dissipated in the transistor, VCE × IC"}
  - {y: vce, label: IC/IB, unit: "", of: [at.IC, "/", x], what: "the forced gain at that point"}
  parameters: [BF, IKF, BR, RC, RE, RB, NK]
  reads_high: |
    A knee far to the right (a large base current needed for the collector to come down) is a low hFE
    at that current; a long, slowly falling tail is a large collector resistance.
  reads_low: |
    A collapse that lands at once on a flat floor is a card with no RC and a default BR: it saturates
    like a switch with no ohmic part, which no transistor does.
  cannot_tell: |
    Quasi-saturation, which the plain Gummel-Poon model does not have, and the thermal droop at high
    power, since the junction is held at 25 °C.
  standard: resembles the saturation region chart of onsemi data sheets; no test method
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the collector drive of the first copy: 1 mA pulled out of its collector"
  - "IV0 0 cv0 0.001"
  - "* a clamp diode from that collector to 30 V: a transistor that cannot pass the current has its collector caught here"
  - "DCV0 cv0 cl0 DCLMP"
  - "* the 30 V the clamp holds"
  - "VCV0 cl0 0 30"
  - "* the base drive: 10 to the power of the dial, in amperes"
  - "BV0 0 bv0 I=exp(2.302585092994046*V(x))"
  - "* the first copy, emitter grounded; the others carry 10 mA, 100 mA and 1 A"
  - "QV0 cv0 bv0 0 DUT"
  - "* the sweep: IB 1 nA to 1 A at twenty points per decade"
  - ".dc VX -9 0 0.05"
  - "* read: VCE as the collector voltage of each copy, where it sits below the clamp"

- id: bjt-on-voltages
  kind: bjt
  group: dc
  name: On voltages — VBE(sat), VBE(on) and VCE(sat) against collector current
  symbols: [VBE(sat), VBE(on), VCE(sat)]
  what: |
    The figure onsemi prints as "On voltages": the three voltages of a transistor that is on, against
    collector current, on one chart. VBE(on) is the base-emitter voltage in the active region (VCE = 5 V);
    VBE(sat) the same with the base over-driven (IC/IB = 10), a little higher because the base carries
    more current; VCE(sat) the collector-emitter voltage then. Together they show how much the base
    must be driven past the active region to saturate, and what the switch is left with.
  circuit: |
    No circuit of its own: the curves are those of the hFE sweep at 5 V and of the forced-ratio
    saturation sweep at IC/IB = 10, laid on one chart.
  drawing:
    file: ""
    elements: []
    differs_from_netlist: nothing
  analysis: derived
  conditions:
    from: [bjt-hfe-ic, bjt-saturation]
    vce: 5
    forced_hfe: 10
  grid: {x: ic, from: 1.0e-4, to: 10, per_decade: 5, unit: A}
  extraction: |
    The VBE curve of the hFE measurement at 5 V and the VBE(sat) and VCE(sat) curves of the saturation
    measurement at IC/IB = 10, on the saturation measurement's grid. The rise is VBE(sat) less VBE(on)
    at 1 mA.
  outputs:
  - {key: "vbe_sat_rise@1mA", unit: V, what: "VBE(sat) at IC/IB = 10 less VBE(on) at 5 V, at 1 mA: the extra base voltage saturation takes"}
  curves:
  - {name: "VBE(sat), IC/IB=10", x: ic, y: von, scale: lin, unit: V}
  - {name: "VBE(on), VCE=5V", x: ic, y: von, scale: lin, unit: V}
  - {name: "VCE(sat), IC/IB=10", x: ic, y: von, scale: lin, unit: V}
  family:
    note: "VBE(sat) and VCE(sat) at IC/IB = 10; VBE(on) at VCE = 5 V"
  parameters: [IS, NF, BR, NR, RB, RE, RC, IKF]
  reads_high: |
    A VBE(sat) far above VBE(on) at high current is a large base resistance: the base drive is lost in
    RB.
  reads_low: |
    A VCE(sat) that crosses below zero at low current is a card with NR above NF: not a transistor's
    behaviour.
  cannot_tell: |
    The sheet's own conditions where they differ (VBE(on) at 1 V, or at IC/IB = 20); those are in the
    hFE and saturation measurements.
  standard: resembles the "On voltages" chart of onsemi data sheets; no test method
  pack: true
  engines: [qspice, ngspice, ltspice]

- id: bjt-reverse
  kind: bjt
  group: dc
  name: The transistor used backwards — reverse current gain
  symbols: [hFE(reverse), BR]
  what: |
    Emitter and collector exchanged. The reverse gain of a real transistor is small, one to ten,
    because the collector was not built to emit. It matters more than it seems: it decides the floor
    of VCE(sat), it decides how fast stored charge clears when a switch turns off, and it is what an
    over-driven input stage runs on when the signal reverses the collector junction. It is also the
    clearest sign of an unfitted card: a BR left at its default of 1 appears in thousands of library
    models.
  circuit: |
    The transistor connected as in the hFE measurement, but with the emitter and the collector
    swapped: the emitter terminal is held at 1 V and the collector terminal grounded, the base fed by
    the swept current source. The current into the emitter terminal over the base current is the
    reverse gain.
  drawing:
    file: bench/drawings/bjt-reverse.svg
    elements: [DUT drawn upside down, 1 V source on the emitter terminal, swept base current source, ammeter in the emitter lead]
    differs_from_netlist: nothing
  analysis: dc
  conditions: {ib_sweep: {from: 1.0e-8, to: 0.1, per_decade: 20, unit: A}, vec: 1, ic_ladder: [1.0e-3], temp_c: 25}
  extraction: |
    The reverse gain interpolated at 1 mA of (reverse) collector current.
  outputs:
  - {key: "hfe_reverse@1mA", unit: "", what: "reverse current gain at 1 mA, VEC = 1 V"}
  parameters: [BR, NR, IKR, VAR, ISC, NC]
  reads_high: |
    A reverse gain above 10 is unusual in a real part; in a model it usually means BR was set equal to
    BF by a template.
  reads_low: |
    Exactly 1.00 is the default nobody changed.
  cannot_tell: ""
  standard: none
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the emitter held at 1 V"
  - "VR er 0 1"
  - "* the base drive: 10 to the power of the dial, in amperes"
  - "BR 0 br I=exp(2.302585092994046*V(x))"
  - "* the transistor with its collector grounded and its emitter at 1 V: it runs backwards, the emitter acting as collector"
  - "QR 0 br er DUT"
  - "* the sweep: 1 nA to 1 A"
  - ".dc VX -9 0 0.05"
  - "* read: the reverse gain as the emitter supply's current over the drive, at 1 mA"

- id: bjt-capacitance
  kind: bjt
  group: capacitance
  name: Cob and Cib against reverse voltage
  symbols: [Cob, Cib]
  what: |
    The two junction capacitances. Cob is the collector-base capacitance with the emitter open, the
    one data sheets print as "Cob = 4 pF at 10 V, 1 MHz"; in a common-emitter stage it is multiplied
    by the voltage gain (the Miller effect) and becomes the dominant pole that sets the bandwidth, and
    in an RF stage it is the feedback that makes the stage unstable. Cib is the emitter-base
    capacitance with the collector open; it adds to the input capacitance and it is the larger of the
    two. Both fall as the reverse voltage grows, because the depletion layer widens: on logarithmic
    axes the fall is a straight line whose slope is the grading coefficient M (one third for a
    linearly graded junction, one half for an abrupt one). A model whose capacitance does not fall
    with voltage, or has none, will get every frequency-dependent result wrong — bandwidth, slew,
    switching times, fT — however good its DC curves are.
  circuit: |
    For Cob, a voltage source on the collector with a 1 V alternating component on top of the bias,
    the base grounded, and the emitter left open through a very large resistor. For Cib, the same with
    the emitter and the collector exchanged. The current drawn from the alternating source at 1 MHz
    gives the capacitance, as a capacitance meter reads it. Eight copies at eight bias voltages share
    one run.
  drawing:
    file: bench/drawings/bjt-capacitance.svg
    elements: [DUT, bias source with AC 1 V on the collector (or emitter), base grounded, third terminal open through 1 TΩ, AC ammeter]
    differs_from_netlist: the eight bias points run as eight copies in one deck; the drawing shows one
  analysis: ac
  conditions:
    v_ladder: [0.1, 0.5, 1, 2, 5, 10, 20, 30]
    cob_extra: [50, 100, 200, 300]   # Cob alone, for high-voltage parts; an emitter junction breaks down at a few volts
    f: 1.0e+6
    ac_sweep: {from: 1.0e+3, to: 1.0e+8, per_decade: 20, unit: Hz}
    temp_c: 25
  grid: {x: v, values: [0.1, 0.5, 1, 2, 5, 10, 20, 30, 50, 100, 200, 300], unit: V}
  extraction: |
    At each bias, the capacitance a meter reads at 1 MHz, the frequency of nearly every data sheet (a
    few older and power-transistor sheets use 100 kHz): the series-equivalent capacitance of the
    impedance the source sees, C = |I|² / (2π · 1 MHz · |Im I|), the reading meters use for a
    capacitance of low impedance. For a junction of picofarads it equals the parallel reading
    |Im I| / (2π · 1 MHz) to a part in a million; for the nanofarads of a power transistor's emitter
    junction behind a few ohms of base resistance it is the only reading the resistance does not pull
    down: the parallel one falls by 1 + (2πf·R·C)², a factor of 4.5 for 81 nF behind 3.7 Ω (catalogues
    before m-11 published the parallel reading). A card with no capacitance reads zero. Cob is also
    taken at 50, 100, 200 and 300 V, for high-voltage parts (beyond a part's own VCBO the number is the model's, not a transistor's). The grading coefficient is the slope of log C against
    log (V + VJ) between 1 and 10 V, with VJ taken as 0.7 V; the ratio C(1 V)/C(10 V) is published as
    the simpler figure.
  outputs:
  - {key: "cob@{v}", unit: F, what: "collector-base capacitance, emitter open, at each ladder voltage", plotted: true}
  - {key: "cib@{v}", unit: F, what: "emitter-base capacitance, collector open, at each ladder voltage", plotted: true}
  - {key: cob_m, unit: "", what: "grading coefficient of Cob between 1 and 10 V"}
  - {key: cob_1v_over_10v, unit: "", what: "Cob at 1 V over Cob at 10 V"}
  curves:
  - {name: Cob, x: v, y: cob, scale: log, unit: "F"}
  - {name: Cib, x: v, y: cib, scale: log, unit: "F", grid: {x: v, values: [0.1, 0.5, 1, 2, 5, 10, 20, 30], unit: V}}
  parameters: [CJC, VJC, MJC, XCJC, CJE, VJE, MJE, FC]
  reads_high: |
    A ratio C(1 V)/C(10 V) near 2 is a normal abrupt-ish junction; near 1 the capacitance is constant
    with voltage, which only happens when MJC is near zero. A Cob of tens of picofarads in a model of
    a small-signal part will halve its simulated bandwidth.
  reads_low: |
    A Cob of exactly zero is a card without CJC: the model has no Miller capacitance and will show a
    bandwidth the part does not have. The code "absent" is used rather than the number.
  cannot_tell: |
    Where the capacitance sits: a real transistor's Cob is partly inside the base resistance (the card
    splits it with XCJC), which only shows in the high-frequency response, not in this measurement.
    Some sheets print Cre (emitter grounded) instead of Cob; the two differ.
  standard: resembles the open-circuit output capacitance methods (MIL-STD-750-3, 1 MHz), read as a meter reads a capacitance of low impedance (series equivalent)
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the Cob copy at 0.1 V: its collector held at the reverse voltage with 1 V of AC on top"
  - "VO0 ao0 0 DC 0.1 AC 1"
  - "* its base grounded"
  - "VBO0 bo0 0 0"
  - "* its emitter open: 1 GΩ to ground"
  - "REO0 eo0 0 1e9"
  - "* the Cob copy"
  - "QO0 ao0 bo0 eo0 DUT"
  - "* the Cib copy at 0.1 V: its emitter held at the reverse voltage with 1 V of AC"
  - "VI0 ai0 0 DC 0.1 AC 1"
  - "* its collector open: 1 GΩ to ground"
  - "RCI0 ci0 0 1e9"
  - "* the Cib copy, base grounded as above"
  - "QI0 ci0 bi0 ai0 DUT"
  - "* ten points per decade from 100 kHz to 10 MHz; C = Im(I) / (2πf) is read at 1 MHz"
  - ".ac dec 10 100000 10000000"
  - "* one such pair per reverse voltage: 0.1, 0.5, 1, 2, 5, 10, 20 and 30 V"

- id: bjt-ft
  kind: bjt
  group: frequency
  name: Transition frequency against collector current
  symbols: [fT]
  what: |
    The frequency at which the common-emitter current gain has fallen to one: the single number that
    separates an audio transistor (100 to 300 MHz), a video one (around 1 GHz) and an RF one (tens of
    GHz). It is not a constant of the part. It rises with collector current, because the junction
    capacitances are charged faster by a larger current, it peaks, and then it falls again when high
    injection widens the base (the Kirk effect). Every data sheet draws this curve, and a model gets
    it from three things: the forward transit time TF (the time a carrier takes to cross the base),
    the two junction capacitances, and the parameters that describe the fall at high current (XTF,
    ITF, VTF). A card with TF but no capacitances, or capacitances but no TF, has an fT that is right
    at one current at best.
  circuit: |
    The transistor with its emitter grounded, the collector held at 5 V (and a second set of copies at
    10 V, the voltage Toshiba, Nexperia and the RF sheets use), the base biased by a current
    source set from the hFE measurement so that the collector current is one ladder step, with a 1 A
    alternating current added on top (the magnitude is arbitrary in a linear small-signal analysis).
    The alternating collector current, read through the collector source, is the current gain |h21|
    against frequency. Up to eight copies at eight collector currents share one run.
  drawing:
    file: bench/drawings/bjt-ft.svg
    elements: [DUT, VCE source 5 V, base bias current source with an AC component, AC ammeter in the collector]
    differs_from_netlist: the ladder currents run as copies in one deck; the drawing shows one
  analysis: ac
  conditions:
    vce: [5, 10]                   # the first keeps its copy names (the directives quote them) and gives the summary values
    ic_ladder: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10]
    ac_sweep: {from: 1.0e+3, to: 1.0e+11, per_decade: 20, unit: Hz}   # from 1 kHz: the low end gives the AC gain (bjt-hfe-ac)
    read_at: [1.0e+6, 2.0e+7, 1.0e+8]   # the frequencies sheets measure |hfe| at to give fT = |hfe| × f: power parts 1 MHz, small-signal 20 or 100 MHz
    temp_c: 25
  grid: {x: ic, values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1, 10], unit: A}
  extraction: |
    Two readings per current: the frequency at which |h21| crosses 1 (interpolated on log-log axes),
    and |h21| times frequency taken where |h21| is between 2 and 10 — the way sheets measure it, which
    is less sensitive to the parasitics above the gain-bandwidth region. The peak and the current at
    the peak come from the second reading; the roll-off is fT at the highest ladder current reached
    over the peak. The whole |hfe| curve against frequency is kept at each current, five points per
    decade, and the beta cut-off is where it has fallen to 1/√2 of its 1 kHz value. fT is also read the
    way most sheets measure it, |hfe| × f at a fixed 1, 20 or 100 MHz (power parts are measured at
    1 MHz, small-signal ones at 20 or 100 MHz). It is the same number where |hfe| falls as 1/f there, so
    it is given only where that frequency is above the beta cut-off and |hfe| is still 1.5 or more: below
    the cut-off the product is an underestimate, and near unity the base-collector capacitance feeds the
    drive straight through and the product means nothing.
  outputs:
  - {key: "ft@{ic},{vce}", unit: Hz, what: "fT by extrapolation at each ladder current, at 5 and at 10 V", plotted: true}
  - {key: "ft_unity@{ic},{vce}", unit: Hz, what: "the frequency where |h21| = 1", plotted: true}
  - {key: ft_peak, unit: Hz, what: "highest fT along the ladder at 5 V"}
  - {key: ic_at_ft_peak, unit: A, what: "collector current at that peak"}
  - {key: ft_rolloff, unit: "", what: "fT at the top current over the peak, at 5 V (1.0 = no fall)"}
  - {key: "f_beta@{ic},{vce}", unit: Hz, what: "the beta cut-off: the frequency at which |hfe| has fallen to 1/√2 of its 1 kHz value", plotted: true}
  - {key: "ft_at@{ic},{vce},{f}", unit: Hz, what: "|hfe| × f at 1, 20 and 100 MHz, fT the way sheets measure it; given only where that frequency is above the beta cut-off and |hfe| there is 1.5 or more", plotted: true}
  curves:
  - {name: "fT, VCE=5V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 5, f: extrapolated}}
  - {name: "fT, VCE=10V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 10, f: extrapolated}}
  - {name: "fT at 1MHz, VCE=5V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 5, f: 1.0e+6}}
  - {name: "fT at 20MHz, VCE=5V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 5, f: 2.0e+7}}
  - {name: "fT at 100MHz, VCE=5V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 5, f: 1.0e+8}}
  - {name: "fT at 1MHz, VCE=10V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 10, f: 1.0e+6}}
  - {name: "fT at 20MHz, VCE=10V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 10, f: 2.0e+7}}
  - {name: "fT at 100MHz, VCE=10V", x: ic, y: ft, scale: log, unit: "Hz", at: {VCE: 10, f: 1.0e+8}}
  - {name: "|hfe|, 100µA, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-4, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 1mA, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-3, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 10mA, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-2, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 100mA, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-1, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 1A, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 1, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 10A, VCE=5V", x: f, y: h21, scale: log, unit: "", at: {IC: 10, VCE: 5}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 100µA, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-4, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 1mA, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-3, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 10mA, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-2, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 100mA, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 1.0e-1, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 1A, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 1, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  - {name: "|hfe|, 10A, VCE=10V", x: f, y: h21, scale: log, unit: "", at: {IC: 10, VCE: 10}, grid: {x: f, from: 1.0e+3, to: 1.0e+11, per_decade: 5, unit: Hz}}
  select: {IC: 1.0e-3, VCE: 5, f: extrapolated}
  hover:
  - {y: ft, label: P, unit: W, of: [x, "*", at.VCE], what: "power dissipated in the transistor, VCE × IC"}
  - {y: h21, label: "f·|hfe|", unit: Hz, of: [x, "*", y], what: "the gain-bandwidth product; it equals fT where |hfe| falls as 1/f"}
  parameters: [TF, XTF, VTF, ITF, PTF, CJE, CJC, RB, RE, RC]
  reads_high: |
    An fT far above the part's family (a gigahertz in a model of an audio transistor) usually means a
    TF copied from another card or set to zero; its simulated stages will be too fast and may
    oscillate where the real circuit does not.
  reads_low: ""
  cannot_tell: |
    The curve at the sheet's own VCE when that is 20 V; fT also rises slowly with VCE. A card
    whose fT never falls at high current (roll-off 1.0) is missing XTF and ITF, which only the
    capability layer can say for sure. With no TF and no capacitances the gain never falls and the
    code is "absent".
  standard: resembles the small-signal current gain at frequency method (fT by extrapolation, MIL-STD-750-3)
  pack: true
  engines: [qspice, ngspice, ltspice]
  directives:
  - "* the collector supply of the first copy, 5 V; its current is the collector current"
  - "VCT0 ct0 0 5"
  - "* the first copy; IBT0 (not shown) feeds its base the DC current for the ladder step with 1 A of AC on top; one copy per step"
  - "QT0 ct0 bt0 0 DUT"
  - "* twenty points per decade from 1 kHz to 100 GHz; the low end serves the AC gain measurement too"
  - ".ac dec 20 1000 1e+11"
  - "* read: |h21| = the AC collector current over the 1 A of AC base current; fT where it crosses 1"

- id: bjt-switching
  kind: bjt
  group: switching
  name: td, tr, ts and tf in a resistive-load switch
  symbols: [td, tr, ts, tf]
  what: |
    The four times of a switching data sheet: the delay before the collector current starts, the rise
    to 90 %, the storage time before it starts to fall after the base is driven off, and the fall. The
    storage time is the one that matters and the one most models get wrong: a saturated transistor
    holds excess charge in its base, and the switch cannot turn off until that charge has been pulled
    out by the reverse base drive. In a model, that charge is the reverse transit time TR times the
    current; a card with TR = 0 turns off instantly, which no bipolar switch does. Fixtures scaled to
    ten currents from 10 mA to 10 A (a 1-2-5 series) are run from a 10 V and from a 30 V supply (the
    voltage most switching sheets use), because a model fitted at one current can be far off at
    another, and so that the four times can be drawn against current as the sheets draw them.
  circuit: |
    A 10 V or 30 V supply through a load resistor chosen so that the switched current is the step
    (RL = VCC / IC), the collector current read through a 0 V source. The base is driven from a
    voltage pulse through a base resistor RB = 100 V / IC: a pulse from −9.3 V to +10.7 V then gives a
    forward base current and a reverse base current both equal to one tenth of the collector current
    past a 0.7 V base-emitter drop, as the 2N2222A fixture does. Edges of 2 ns, and three pulse lengths,
    because data sheets use pulses from microseconds to hundreds of microseconds (10 µs for the PN2222A,
    10 to 500 µs for the 2N3904's storage time, 100 to 500 µs for the TIP31C) and a slow model, or a
    power transistor whose stored charge takes long to build, may not have switched on, or not fully,
    by the end of a short one: 3 µs on with 5 µs watched after the turn-off edge, 10 µs with 5 µs, and
    100 µs with 50 µs, the largest time step growing with the pulse (0.25, 1 and 10 ns) so that a long
    pulse costs about what a short one does. Each waveform is published as 80 time and current pairs placed where it
    bends, the time at five significant figures, so that an edge of a few nanoseconds can still be read
    at 3 µs; the four times are also drawn against the switched current.
  drawing:
    file: bench/drawings/bjt-switching.svg
    elements: [DUT, supply 10 V, load resistor RL = 10 V / IC, pulse source, base resistor RB, probe on the collector]
    differs_from_netlist: nothing
  analysis: tran
  conditions:
    vcc: [10, 30]                  # the first keeps the deck names the directives quote
    ic_ladder: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10]
    waveforms: [1.0e-2, 1.0e-1, 1, 10]   # the currents whose IC(t) is published; the times are published at every one
    forced_hfe: 10
    rb_times_ic: 100      # RB = 100 V / IC, so that a ±10 V pulse gives IB1 = IB2 = IC/10 past a 0.7 V VBE
    v_on: 10.7
    v_off: -9.3
    t_start_s: 1.0e-7
    edge_s: 2.0e-9
    pulses:               # on time, time watched after it, largest step; the first keeps the names the directives quote
    - {t_on_s: 3.0e-6, t_after_s: 5.0e-6, max_step_s: 2.5e-10}
    - {t_on_s: 1.0e-5, t_after_s: 5.0e-6, max_step_s: 1.0e-9}
    - {t_on_s: 1.0e-4, t_after_s: 5.0e-5, max_step_s: 1.0e-8}
    curve_points: 80      # [t, IC] pairs kept of each waveform, placed where it bends
    temp_c: 25
  extraction: |
    The 10 % and 90 % crossings of the collector current, measured from the 10 % points of the input
    edges: td from the input's rise to IC at 10 %; tr from 10 % to 90 %; ts from the input's fall to IC
    back at 90 %; tf from 90 % to 10 %. The stored charge is ts times the reverse base current. The
    collector current at the end of the pulse (the mean of its last fifth) is published over the
    switched current, at every step: below 0.9 the step did not switch, its times are left out, and the
    number says how far it got.
  outputs:
  - {key: "td@{ic},{vcc},{pulse}", unit: s, what: "delay time at each switched current, supply and pulse length", plotted: true}
  - {key: "tr@{ic},{vcc},{pulse}", unit: s, what: "rise time", plotted: true}
  - {key: "ts@{ic},{vcc},{pulse}", unit: s, what: "storage time", plotted: true}
  - {key: "tf@{ic},{vcc},{pulse}", unit: s, what: "fall time", plotted: true}
  - {key: "qs@{ic},{vcc},{pulse}", unit: C, what: "stored charge, ts times the reverse base current"}
  - {key: "on@{ic},{vcc},{pulse}", unit: "", what: "the collector current at the end of the pulse over the switched current: below 0.9 the step did not switch"}
  curves:
  - {name: "IC(t), 10mA", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 10, pulse: 3.0e-6}}
  - {name: "IC(t), 100mA", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 10, pulse: 3.0e-6}}
  - {name: "IC(t), 1A", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 10, pulse: 3.0e-6}}
  - {name: "IC(t), 10A", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 10, pulse: 3.0e-6}}
  - {name: "IC(t), 10mA, VCC=30V", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 30, pulse: 3.0e-6}}
  - {name: "IC(t), 100mA, VCC=30V", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 30, pulse: 3.0e-6}}
  - {name: "IC(t), 1A, VCC=30V", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 30, pulse: 3.0e-6}}
  - {name: "IC(t), 10A, VCC=30V", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 30, pulse: 3.0e-6}}
  - {name: "IC(t), 10mA, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 10, pulse: 1.0e-5}}
  - {name: "IC(t), 100mA, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 10, pulse: 1.0e-5}}
  - {name: "IC(t), 1A, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 10, pulse: 1.0e-5}}
  - {name: "IC(t), 10A, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 10, pulse: 1.0e-5}}
  - {name: "IC(t), 10mA, VCC=30V, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 30, pulse: 1.0e-5}}
  - {name: "IC(t), 100mA, VCC=30V, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 30, pulse: 1.0e-5}}
  - {name: "IC(t), 1A, VCC=30V, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 30, pulse: 1.0e-5}}
  - {name: "IC(t), 10A, VCC=30V, 10µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 30, pulse: 1.0e-5}}
  - {name: "IC(t), 10mA, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 10, pulse: 1.0e-4}}
  - {name: "IC(t), 100mA, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 10, pulse: 1.0e-4}}
  - {name: "IC(t), 1A, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 10, pulse: 1.0e-4}}
  - {name: "IC(t), 10A, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 10, pulse: 1.0e-4}}
  - {name: "IC(t), 10mA, VCC=30V, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-2, VCC: 30, pulse: 1.0e-4}}
  - {name: "IC(t), 100mA, VCC=30V, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1.0e-1, VCC: 30, pulse: 1.0e-4}}
  - {name: "IC(t), 1A, VCC=30V, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 1, VCC: 30, pulse: 1.0e-4}}
  - {name: "IC(t), 10A, VCC=30V, 100µs", x: t, y: ic, scale: lin, unit: "A", x_unit: "s", at: {IC: 10, VCC: 30, pulse: 1.0e-4}}
  - {name: "td", x: ic, y: td, scale: log, unit: s, at: {VCC: 10, pulse: 3.0e-6}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "td, VCC=30V", x: ic, y: td, scale: log, unit: s, at: {VCC: 30, pulse: 3.0e-6}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "td, 10µs", x: ic, y: td, scale: log, unit: s, at: {VCC: 10, pulse: 1.0e-5}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "td, VCC=30V, 10µs", x: ic, y: td, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-5}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "td, 100µs", x: ic, y: td, scale: log, unit: s, at: {VCC: 10, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "td, VCC=30V, 100µs", x: ic, y: td, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr", x: ic, y: tr, scale: log, unit: s, at: {VCC: 10, pulse: 3.0e-6}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr, VCC=30V", x: ic, y: tr, scale: log, unit: s, at: {VCC: 30, pulse: 3.0e-6}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr, 10µs", x: ic, y: tr, scale: log, unit: s, at: {VCC: 10, pulse: 1.0e-5}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr, VCC=30V, 10µs", x: ic, y: tr, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-5}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr, 100µs", x: ic, y: tr, scale: log, unit: s, at: {VCC: 10, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
  - {name: "tr, VCC=30V, 100µs", x: ic, y: tr, scale: log, unit: s, at: {VCC: 30, pulse: 1.0e-4}, grid: {x: ic, values: [1.0e-2, 2.0e-2, 5.0e-2, 1.0e-1, 2.0e-1, 5.0e-1, 1, 2, 5, 10], unit: A}}
