- id: opamp-psrr-f
  kind: opamp
  group: supply
  name: PSRR against frequency, each rail alone and both together
  symbols: [PSRR(f)]
  what: |
    The follower with 1 V of AC on the positive rail, on the negative, and on both in antiphase (onsemi
    varies them together, the audio sheets each alone), 1 Hz to 10 MHz. Read at 10 Hz, 1 kHz, 10 kHz,
    100 kHz and 1 MHz; the corner. A model whose internal references are ideal reports a rejection beyond
    200 dB on one or both rails: absent.
  circuit: Three decks, the follower with the AC on the rail (or rails) named, 2 kΩ load, the input at the reference.
