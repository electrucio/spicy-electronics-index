- id: opamp-separation
  kind: opamp
  group: supply
  name: Channel separation
  symbols: [separation]
  what: |
    For a subcircuit with two or four amplifiers, the crosstalk from a driven channel to a quiet one. A
    macromodel of one amplifier in a package of two shares nothing: the result is absent, which is the
    finding. The fixture for dual subcircuits (onsemi's, the driven channel at G = +1 with 20 Vpp into
    2 kΩ, the measured one at G = +100) is the next catalogue version's.
