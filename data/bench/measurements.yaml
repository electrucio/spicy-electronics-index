- id: opamp-noise
  kind: opamp
  group: noise
  name: Voltage and current noise against frequency, the 1/f corner and 0.1–10 Hz
  symbols: [en, in]
  what: |
    The follower's input-referred noise by .noise with RS = 0 (en) and with 100 kΩ (in, by subtraction),
    0.1 Hz to 1 MHz; spot values at 10 Hz, 100 Hz, 1 kHz and 10 kHz; the 1/f corner; the integrated rms
    over 0.1–10 Hz, 10 Hz–10 kHz (the legacy TL07x figure) and 20 Hz–20 kHz; the 0.1–10 Hz peak-to-peak as
    6.6 times the rms; en at 1 kHz at ±5 V. A macromodel with no noise sources (most) gives its resistors'
    thermal noise only: the finding is absent.
  circuit: The follower with 2 kΩ, the noise source at its input, with or without the source resistance.
  drawing: {file: "", elements: [DUT as a follower, noise source, RS], differs_from_netlist: one deck per source resistance}
  analysis: noise
  conditions:
    supply: [15, -15]
    rl: 2000
    sweep: {from: 0.1, to: 1.0e+6, per_decade: 20, unit: Hz}
    spot_sweep: {from: 1000, to: 1000, per_decade: 2, unit: Hz}
    f_points: [10, 100, 1000, 10000]
    bands: [[0.1, 10], [10, 10000], [20, 20000]]
    rs_in: 100000
    supply_variant: [5, -5]
  grid: {x: f, from: 0.1, to: 1.0e+6, per_decade: 5, unit: Hz}
  extraction: |
    en from the RS = 0 run; in from the 100 kΩ run less en² and the resistor's 4kT·RS; the corner where
    en is √2 times its 10 kHz value, absent when flat; the bands by trapezoids on the sweep's points.
    Noise sources absent when en at 1 kHz is below 0.1 nV/√Hz.
  outputs:
  - {key: "en@{f}", unit: "V/√Hz", what: "voltage noise density at the spot frequencies"}
  - {key: f_corner_en, unit: Hz, what: "the 1/f corner of en, or absent"}
  - {key: "en_rms@{band}", unit: V, what: "the integrated noise over each band"}
  - {key: "en_pp@0.1-10Hz", unit: V, what: "6.6 times the 0.1–10 Hz rms"}
  - {key: "in@1kHz", unit: "A/√Hz", what: "current noise density at 1 kHz"}
  - {key: in_note, unit: "", what: "absent when the current noise is below the floor"}
  - {key: "en@1kHz,±5V", unit: "V/√Hz", what: "en at 1 kHz at ±5 V"}
  - {key: noise_sources, unit: "", what: "present, or absent when the model carries none"}
  curves:
  - {name: "en", x: f, y: en, scale: log, unit: "V/√Hz"}
  - {name: "in", x: f, y: in, scale: log, unit: "A/√Hz"}
  parameters: []
  reads_high: ""
  reads_low: "An en of picovolts is the thermal noise of the model's resistors: no noise sources."
  cannot_tell: "Burst noise, and the part's own noise, which makers measure on a few samples."
  standard: none
  pack: false
  engines: [qspice, ngspice]
  directives:
  - "VP vp 0 15"
  - "VN vn 0 -15"
  - "* the noise source at the follower's input, RS = 0; a second run with 100 kΩ"
  - "VIN in 0 DC 0 AC 1"
  - "XN in out vp vn out DUT"
  - "RL out 0 2000"
  - ".noise V(out) VIN dec 20 0.1 1000000"

- id: opamp-noise-rs
  kind: opamp
  group: noise
  name: Total noise against source resistance, noise figure and the weighted figures
  symbols: [VT, NF]
  what: |
    The total input-referred noise at 1 kHz with 1 kΩ, 10 kΩ, 100 kΩ and 1 MΩ in the input (onsemi's and
    Analog Devices' figures), the noise figure from it, and the integrated 20 Hz–20 kHz noise flat,
    A-weighted (which stands for JIS-A) and RIAA-weighted through a 30 kHz low-pass, at RS = 300 Ω and
    2.2 kΩ: the Nisshinbo figures, the one test specific to the Japanese audio sheets.
