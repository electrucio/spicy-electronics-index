  drawing: {file: "", elements: [], differs_from_netlist: ""}
  analysis: derived
  conditions: {}
  extraction: Absent for every single-amplifier subcircuit, which every model run today is.
  outputs:
  - {key: separation, unit: "", what: "absent: one amplifier in the subcircuit"}
  parameters: []
  reads_high: ""
  reads_low: ""
  cannot_tell: "Anything, until dual subcircuits are run."
  standard: none
  pack: false
  engines: [qspice, ngspice, ltspice]

- id: opamp-agreement
  kind: opamp
  group: dc
  name: Do the three simulators agree?
  symbols: []
  what: |
    As the bipolar agreement, over every output above. Macromodels disagree between simulators on
    behavioural sources (PSpice TABLE and VALUE expressions, LTspice's own functions), on the convergence
    of their clamps, and on noise analysis; the disagreeing ids say which.
  circuit: ""
  drawing: {file: "", elements: [], differs_from_netlist: ""}
  analysis: derived
  conditions: {tolerances: [0.01, 0.05], floors: {F: 1.0e-16, s: 1.0e-12, A: 1.0e-14}}
  extraction: |
    For each published output, the spread (max − min over the mean) across the engines that produced it,
    classed as within 1 %, within 5 % or beyond; values below the floors count as zero.
  outputs:
  - {key: agree_1pct, unit: "", what: "share of outputs on which every engine agrees within 1 %"}
  - {key: agree_5pct, unit: "", what: "share within 5 %"}
  - {key: odd_engine, unit: "", what: "the engine most often alone outside 5 %, or none"}
  - {key: disagreeing, unit: "", what: "the measurement ids where the engines differ by more than 5 %"}
  parameters: []
  reads_high: ""
  reads_low: ""
  cannot_tell: "Which engine is right."
  standard: none
  pack: false
  engines: [qspice, ngspice, ltspice]
