  - {name: "VT wideband, 30µA", x: rs, y: vt_band, scale: log, unit: V, at: {IC: 3.0e-5}, grid: {x: rs, from: 10, to: 1.0e+7, per_decade: 5, unit: "Ω"}}
  - {name: "VT wideband, 100µA", x: rs, y: vt_band, scale: log, unit: V, at: {IC: 1.0e-4}, grid: {x: rs, from: 10, to: 1.0e+7, per_decade: 5, unit: "Ω"}}
  - {name: "VT wideband, 300µA", x: rs, y: vt_band, scale: log, unit: V, at: {IC: 3.0e-4}, grid: {x: rs, from: 10, to: 1.0e+7, per_decade: 5, unit: "Ω"}}
  - {name: "VT wideband, 1mA", x: rs, y: vt_band, scale: log, unit: V, at: {IC: 1.0e-3}, grid: {x: rs, from: 10, to: 1.0e+7, per_decade: 5, unit: "Ω"}}
