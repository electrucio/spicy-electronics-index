# Where parts are bought: the sellers a reader of this index may want, worldwide, with what each is for.
# Compiled on 2026-10-11 from the maintainer's buying guide of that date; the guide's own corrections of
# shipping, duty and reliability claims are not repeated here, because they are dated and regional.
# Enlarged on 2026-10-12 with the distributors Octopart listed for 21 common parts (the ones authorized for
# any of them, and the established independents; one-off brokers left out, each entry's `useful_for` says
# how often it appeared) and with tube, amp, hi-fi, synth and regional shops read one by one in a browser.
# `sei web build` reads this into the site's catalogue. A part page shows the sellers whose catalogues
# cover the part's kind, in tiers — the broad distributors and the maker's own store first, then the
# specialists, then the regional shops and the marketplaces folded away — each with a search at the
# seller for the part wherever `search` gives the address pattern ({part} is replaced). The sellers page
# (?sellers=all) shows every seller, with its profile. These are links, not findings: no seller's stock
# is read here, and a seller that forbids scripts loses nothing in the order of the page.
#
# Fields
#   title, url      the seller as it names itself, and its official site
#   type            one of `types` below: what kind of seller it is, which says what still needs checking
#   base            ISO 3166 country of its base or principal market — not where a parcel ships from; WW
#                   for a marketplace, where the seller you buy from is anywhere
#   group           one of `groups` below; a group's `kinds` are the kinds of part whose page lists it
#   kinds           optional: the kinds this seller's catalogue covers, when they differ from its group's;
#                   [] keeps it off every part page
#   makers          optional: the makers (ids of data/parts/makers.yaml) it is the store of; shown first
#                   on those makers' parts, the lineage included
#   useful_for      what its catalogue covers, from the guide; a judgment on the catalogue, not a service test
#   search          optional: the address of a search for a part number at the seller ({part} is replaced)
#   search_checked, search_result   what following `search` gave on that date; an address the site would
#                   not let a script verify says so, and is to be checked in a browser
#   priority        the maintainer's order of first comparison: 1 compare first, 2 the usual, 3 last resort
#                   (marketplaces and surplus, where the seller and the item decide what arrives)
#   checked         when the entry was last read against the seller's site
#   robots          what the seller's robots.txt said on `robots_checked`, asked for `*` and for the AI-agent
#                   names core.http checks, for the home page and for the part search: the technical permission
#                   to read by script. A site's terms of use may say more. Nothing follows the searches by
#                   script; the field is kept so that nothing ever does without reading it first.
#   about           optional profile: {url, checked, says} — the seller's own account of itself, read at
#                   `url` on `checked` and put in the maintainer's words, never quoted
#   ships           optional: {text, url, checked} — where it ships, as its own pages say
#   opinions        optional: [{forum, title, url, date, gist}] — threads where readers of the forums
#                   discuss the seller: the forum, the thread's title and address, when it was written,
#                   and its gist in the maintainer's words. Links to opinions, not verdicts: the forum is
#                   the source, and a thread is one reader's experience on one day.
#
# "Useful for" is not a reliability score. The guide's rule stands: compare the landed basket, record the
# actual seller and dispatch country, and read the delivery term shown for the transaction.
types:
  manufacturer_direct: the part from its manufacturer
  authorized_distributor: a distributor the manufacturer authorizes for stated lines and territories
  specialist: a focused retailer, often with kits, matching or finishing services
  independent: a sourcing route outside the manufacturer's authorized channel
  marketplace: a platform through which individual sellers transact
  surplus: residual inventory and unusual parts
  fabricator: builds a board, enclosure or panel to your files
  aggregator: compares availability and prices across sellers
  reseller_directory: a manufacturer's list of its resellers
groups:
- id: search
  title: Search and aggregation
  note: Compare availability and prices across sellers; a lead to verify at the seller's own checkout.
  kinds: []
- id: direct
  title: Manufacturer direct
  note: The part from its maker; eligibility, minimums and shipping vary.
  kinds: []
- id: broadline
  title: Broad component distributors
  note: Authorized distribution of many makers' lines; the first comparison for a bill of material.
  kinds: [opamp, ic-audio, regulator, logic, bjt, jfet, mosfet, diode, zener, opto, led, comparator, ota, vca, control, smps, sit, digital-audio, mic-preamp]
- id: obsolete
  title: Obsolete and long-lifecycle parts
  note: Authorized inventory and licensed manufacture of discontinued semiconductors; before independent brokers.
  kinds: [bjt-ge, diode-ge, ic-audio, jfet, sit, vca]
- id: pedal_tube_synth
  title: Pedal, guitar, tube and synth specialists
  note: Focused catalogues with kits, hardware and selected or matched parts.
  kinds: [tube, bjt-ge, diode-ge, jfet, bjt, mosfet, diode, zener, led, opamp, ic-audio, vca, ota, comparator, regulator, logic, opto, control, sit, digital-audio]
- id: project_pcbs
  title: Project PCBs and kits
  note: A design on a board, with its own build document; not a fabricator.
  kinds: []
- id: hifi_transformers
  title: Hi-fi, speakers and transformers
  note: Audio-specific parts and the makers of transformers and audio ICs.
  kinds: [tube]
- id: enclosures
  title: Enclosures, chassis and panels
  note: Boxes by full model number and drawing; customisation and panel services.
  kinds: []
- id: maker
  title: Maker boards, controls and sensors
  note: 'Documented modules around the audio circuit: controls, power, displays, MIDI, digital effects.'
  kinds: []
- id: regional
  title: Regional shops
  note: A nearby shop with confirmed physical stock; export terms vary.
  kinds: []
- id: pcb_fab
  title: PCB fabrication and assembly
  note: Your files made into boards; the headline price is not the delivered, populated board.
  kinds: []
- id: marketplace_surplus
  title: Marketplaces, independent sourcing and surplus
  note: The seller and the item, not the platform, decide what you get.
  kinds: [bjt-ge, diode-ge, tube, jfet, bjt, sit]
  caveat: S97
