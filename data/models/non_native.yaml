# Models of devices SPICE has no element for: loudspeakers, transformers and their cores, pots, switches,
# relays, lamps, light-dependent resistors, thermistors. Each row is a line of the parts list, under the
# part a schematic prints (a product's number) or, for a generic model, under the model's own name.
#
# A row names its models by name and code hash (`sei models named NAME` prints both): `sei models
# match` takes every published definition of those names, and `found` keeps only the ones with that code,
# so identical copies elsewhere join it as copies and somebody else's `Core` or `SPEAKER` does not. Every
# model here is published somewhere a link can lead to; none is ours (2026-10-09).
#
# The top-level key is the kind, an entry of "Passives and hardware" (src/spicy_electronics_index/web/parts.py).


