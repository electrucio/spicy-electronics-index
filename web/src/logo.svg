      C 147.963,444.465 131.872,437.805 119.88,445.818
      C 107.889,453.831 101.432,466.658 91.243,470.37
      C 88.172,471.262 86.002,470.003 87.805,465.703 Z"/>
    <clipPath id="outline-clip"><use href="#outline"/></clipPath>
    <!-- Base skin: paprika red, a touch lighter toward the shoulder. -->
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="100" y1="460" x2="760" y2="60">
      <stop offset="0" stop-color="#B8271A"/>
      <stop offset="0.45" stop-color="#D23A22"/>
      <stop offset="1" stop-color="#DE4A2A"/>
    </linearGradient>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="100" y1="460" x2="760" y2="60">
      <stop offset="0" stop-color="#C9A332"/>
      <stop offset="1" stop-color="#E6CB57"/>
    </linearGradient>
    <!-- Volume: a deep shadow along the belly and a warm rim of light along the back, from the outline itself. -->
    <filter id="volume" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="10" dy="-34" result="up"/>
      <feGaussianBlur in="up" stdDeviation="20" result="upb"/>
      <feComposite in="SourceAlpha" in2="upb" operator="out" result="belly"/>
      <feFlood flood-color="#3D0806" flood-opacity="0.85"/>
      <feComposite in2="belly" operator="in" result="shade"/>
      <feOffset in="SourceAlpha" dx="-4" dy="12" result="down"/>
      <feGaussianBlur in="down" stdDeviation="6" result="downb"/>
      <feComposite in="SourceAlpha" in2="downb" operator="out" result="back"/>
      <feFlood flood-color="#FFB08A" flood-opacity="0.55"/>
      <feComposite in2="back" operator="in" result="rim"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="shade"/><feMergeNode in="rim"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="7"/></filter>
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="720" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" gradientUnits="userSpaceOnUse" x1="700" y1="20" x2="780" y2="160">
      <stop offset="0" stop-color="#8DB24A"/>
      <stop offset="0.45" stop-color="#557F2B"/>
      <stop offset="1" stop-color="#2C4C17"/>
    </linearGradient>
    <linearGradient id="leaf-l" gradientUnits="userSpaceOnUse" x1="0" y1="-45" x2="40" y2="45">
      <stop offset="0" stop-color="#8DB24A"/>
      <stop offset="0.45" stop-color="#557F2B"/>
      <stop offset="1" stop-color="#2C4C17"/>
    </linearGradient>
    <linearGradient id="stalk-l" gradientUnits="userSpaceOnUse" x1="0" y1="-12" x2="0" y2="14">
      <stop offset="0" stop-color="#9DBF5A"/>
      <stop offset="0.6" stop-color="#5E8A30"/>
      <stop offset="1" stop-color="#36591B"/>
    </linearGradient>
    <linearGradient id="stalk" gradientUnits="userSpaceOnUse" x1="750" y1="0" x2="790" y2="0">
      <stop offset="0" stop-color="#9DBF5A"/>
      <stop offset="0.6" stop-color="#5E8A30"/>
      <stop offset="1" stop-color="#36591B"/>
    </linearGradient>
  </defs>
  <!-- A soft shadow the pepper casts, so it sits on the page rather than floating flat on it. -->
  <use href="#outline" transform="translate(6 14)" fill="#000" opacity="0.45" filter="url(#drop)"/>
  <g filter="url(#volume)">
    <use href="#outline" fill="url(#skin)"/>
    <g clip-path="url(#outline-clip)" fill="url(#mark)" stroke="url(#mark)" stroke-width="5" stroke-linejoin="round" opacity="0.9">
