  </g>
  <!-- Gloss: one long streak along the back and a short glint near the tip. -->
  <g clip-path="url(#outline-clip)" fill="none" stroke-linecap="round">
    <path filter="url(#soft)" stroke="url(#gloss)" stroke-width="15" d="M 160,265 C 215,212 290,178 370,160 C 445,144 520,156 590,158 C 640,159 678,150 706,124"/>
    <path filter="url(#soft)" stroke="#fff" stroke-opacity="0.5" stroke-width="7" d="M 118,352 C 121,330 128,310 138,293"/>
  </g>
  <use href="#outline" fill="none" stroke="#5A120C" stroke-opacity="0.7" stroke-width="3" stroke-linejoin="round"/>
  <!-- The calyx and stalk, green, on the shoulder at the lower left; drawn along the pepper's axis there
       (x into the body, y across it), from the point where the outline ends. -->
